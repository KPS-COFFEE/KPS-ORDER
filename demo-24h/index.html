<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPS | تجربة التوصيل 24 ساعة</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0e10;color:#fff;font:15px system-ui,Tahoma}header{padding:22px;background:#151619;border-bottom:2px solid #f58020;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900;color:#f58020}.wrap{max-width:980px;margin:auto;padding:20px}.muted{color:#a4a4a8}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tabs button{white-space:nowrap}.panel{background:#191b1f;border:1px solid #35363a;border-radius:16px;padding:20px;margin-bottom:15px}button,select,input{border-radius:10px;border:1px solid #42444a;background:#24262b;color:#fff;padding:12px;font:inherit}button{cursor:pointer}button.active,.primary{background:#f58020;border-color:#f58020;color:#151515;font-weight:800}button:disabled{opacity:.35}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pill{display:inline-block;background:#35302a;color:#ffb675;padding:7px 12px;border-radius:30px}.line{border-bottom:1px solid #34363a;padding:12px 0}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}h1{font-size:24px}h2{font-size:19px}small{color:#b0b0b5}.notice{background:#29231d;border-right:4px solid #f58020;padding:12px;border-radius:8px}input{width:100%}</style><header><div class="logo">KPS <span style="color:white">COFFEE</span></div><span class="pill">DEMO • حفر الباطن</span></header><div class="wrap"><h1>تجربة تشغيل التوصيل 24 ساعة</h1><p class="muted">ديمو تفاعلي مستقل — جميع الطلبات والأسماء والأرقام افتراضية، ولا يتصل بالنظام الحقيقي.</p><div class="tabs" id="tabs"></div><div id="view"></div></div><script>
let tab='customer',state=0,driver=false,ready=false,picked=false,delivered=false,chat=[],closed=false,orders=1;const stages=['بانتظار تأكيد الفرع','جارٍ تجهيز طلبك','طلبك جاهز للاستلام','طلبك في الطريق إليك','تم تسليم طلبك'];const $=s=>document.getElementById(s);function btn(t,fn,cls=''){return '<button class="'+cls+'" onclick="'+fn+'">'+t+'</button>'}function render(){let names={customer:'العميل',branch:'الفرع',driver:'السائق',supervisor:'المشرف الصباحي',closing:'التقفيلة والمحادثات'};$('tabs').innerHTML=Object.entries(names).map(([k,v])=>btn(v,"tab='"+k+"';render()",tab===k?'active':'')).join('');let v='';if(tab==='customer'){v='<div class="panel"><h2>متابعة الطلب #1258</h2><p>الفرع الذي اختاره العميل: <b>فرع 1</b></p><p class="muted">فرع التنفيذ الداخلي: فرع 2 (لا يظهر للعميل)</p><div class="notice"><h2>'+stages[state]+'</h2><p>'+(['استلمنا طلبك وجارٍ تأكيده','تم تأكيد طلبك ويجري تجهيزه','طلبك جاهز للاستلام','المندوب استلم طلبك وهو في الطريق','بالعافية عليك!'][state])+'</p></div><div class="actions">'+btn('طلب جديد',"reset()", 'primary')+btn('فتح المحادثات',"tab='closing';render()")+'</div></div><div class="panel"><h2>المنتجات</h2><p>جميع الأصناف متوفرة بالفروع، والخلية بفرع 2 فقط.</p><small>العميل لا يرى تفاصيل التحويل بين الفروع.</small></div>'}if(tab==='branch'){v='<div class="panel"><h2>لوحة الفرع المناوب — فرع 2</h2><p class="pill">الطلب #1258</p><p>الحالة: '+stages[state]+'</p><div class="actions">'+btn('قبول الطلب وبدء التجهيز',"state=Math.max(state,1);render()", 'primary')+btn('تم تجهيز الطلب',"if(state>=1){ready=true;state=Math.max(state,2)}render()")+'</div><p class="muted">قبول الفرع ينشئ إشعارًا للسائق؛ تجهيز الطلب يرسل تنبيه الجاهزية.</p></div>'}if(tab==='driver'){v='<div class="panel"><h2>تطبيق السائق — الفترة الصباحية</h2><p>الوردية: 5:00 ص – 2:00 م (مثال)</p><p>الطلبات النشطة في الرحلة: '+orders+'</p><div class="notice">'+(state>=1?'🔔 الفرع قبل الطلب #1258 — الطلب قيد التجهيز':'لا توجد إشعارات جديدة بعد')+'</div><div class="actions">'+btn(driver?'تم قبول المهمة':'قبول المهمة',"if(state>=1)driver=true;render()", 'primary')+btn('إضافة طلب آخر للرحلة',"orders++;render()")+btn('استلام الطلب',"if(driver&&ready){picked=true;state=3}render()")+btn('تم التسليم',"if(picked){delivered=true;state=4}render()")+'</div><small>كل طلب يحتفظ بحالته وتحصيله المستقل حتى عند جمع عدة طلبات في رحلة واحدة.</small></div>'}if(tab==='supervisor'){v='<div class="grid"><div class="panel"><h2>المتابعة الصباحية</h2><p>الطلبات: '+orders+'</p><p>حالة الطلب #1258: '+stages[state]+'</p><p>إسناد السائق: '+(driver?'مؤكد':'بانتظار التأكيد')+'</p><p>الفرع: '+(state>0?'قبل الطلب':'بانتظار القبول')+'</p></div><div class="panel"><h2>تنبيهات التشغيل</h2><p>'+(state>0&&!driver?'⚠️ طلب مقبول دون تأكيد سائق':'لا يوجد تنبيه إسناد حالي')+'</p><p>المحادثات: '+chat.length+' رسالة</p>'+btn('عرض المحادثات',"tab='closing';render()")+'</div></div>'}if(tab==='closing'){v='<div class="grid"><div class="panel"><h2>محادثات العملاء</h2><div class="line">'+(chat.map(x=>'<p>'+x+'</p>').join('')||'لا توجد رسائل')+'</div><input id="msg" placeholder="اكتب رسالة تجريبية"><div class="actions">'+btn('إرسال رسالة',"send()", 'primary')+'</div><p class="muted">المحادثات المفتوحة تنتقل للمساء مع كامل السجل.</p></div><div class="panel"><h2>تقفيلة الفترة الصباحية</h2><p>الفترة: 4:00 ص – 4:00 م</p><p>الطلبات المكتملة: '+(delivered?1:0)+'</p><p>طلبات معلقة: '+(delivered?0:1)+'</p><p>المبيعات التجريبية: '+(delivered?42:0)+' ر.س</p><p>التقفيلة: '+(closed?'تم تسجيل اعتماد تجريبي':'بانتظار الاعتماد')+'</p>'+btn('اعتماد التقفيلة (محاكاة)',"closed=true;render()", 'primary')+'<p class="muted">البيانات المالية افتراضية؛ لا يتم تحصيل أو جرد حقيقي.</p></div></div>'}$('view').innerHTML=v}function send(){let m=$('msg').value.trim();if(m)chat.push('العميل: '+m,'المشرف: وصلتنا رسالتك ونتابع طلبك.');render()}function reset(){state=0;driver=false;ready=false;picked=false;delivered=false;closed=false;orders=1;chat=[];render()}render();
</script></html>
