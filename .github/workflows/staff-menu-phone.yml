name: Staff menu variants and WhatsApp phone acceptance
on:
  push:
    branches: [agent/staff-menu-phone-20261022]
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths: [public/assets/customer-order.js, tests/test_staff_menu_dom.cjs, tests/test_staff_phone_format.cjs, .github/workflows/staff-menu-phone.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_staff_menu_phone
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_staff_menu_phone" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_staff_menu_phone
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm install --prefix "$RUNNER_TEMP/kps-staff-dom" --no-save --package-lock=false jsdom@30.1.3
      - run: node --check public/assets/customer-order.js && node tests/test_staff_phone_format.cjs
      - run: KPS_JSDOM_MODULE="$RUNNER_TEMP/kps-staff-dom/node_modules/jsdom" node tests/test_staff_menu_dom.cjs
      - run: python -m pytest -q tests/test_operational_customer_lookup.py tests/test_delivery_center_matching.py tests/test_morning_manager_browser.py --junitxml=test-results/staff-menu-phone.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-menu-phone-evidence
          path: test-results/
