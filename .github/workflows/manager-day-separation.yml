name: Manager day separation
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
permissions:
  contents: read
jobs:
  postgres-manager-days:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_enbishan_manager_days
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_enbishan_manager_days" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_enbishan_manager_days
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_manager_day_separation.py tests/test_manager_workday.py tests/test_staffing_read_selectors.py tests/test_accounting_manager_shift_day.py tests/test_accounting_shift_bag_scope.py tests/test_aggregate_driver_closure.py tests/test_aggregate_manager_closure.py tests/test_central_workdays.py tests/test_operations_lifecycle_backup.py tests/test_backup.py --junitxml=test-results/manager-days.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-day-separation
          path: test-results/manager-days.xml
