name: Fleet operating log acceptance
on:
  push:
    branches: [agent/kps-order-emergency-v4]
    paths: [app/fleet.py, app/shift_vehicle.py, app/accounting_export.py, app/exports.py, app/db.py, app/main.py, migrations/040_daily_vehicle_operating_log.sql, public/assets/fleet.js, public/ops.css, tests/test_fleet.py, tests/test_fleet_math.py, tests/test_fleet_browser.py, .github/workflows/fleet-operating-log.yml]
  pull_request:
    paths: [app/fleet.py, app/shift_vehicle.py, migrations/040_daily_vehicle_operating_log.sql, public/assets/fleet.js, public/ops.css, tests/test_fleet.py, tests/test_fleet_browser.py, .github/workflows/fleet-operating-log.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_fleet
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_fleet" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_fleet
      TEST_BROWSER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q app tests && node --check public/ops.js && node --check public/assets/fleet.js
      - run: python -m pytest -q tests/test_fleet.py tests/test_fleet_math.py tests/test_fleet_browser.py tests/test_shift_vehicle.py tests/test_vehicle_maintenance.py tests/test_vehicle_maintenance_browser.py tests/test_backup.py tests/test_recovery.py tests/test_operations.py tests/test_driver_cash_handover.py --junitxml=test-results/fleet.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-acceptance
          path: |
            test-results/
            test-artifacts/
