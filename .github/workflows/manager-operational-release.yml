name: Manager operational release acceptance
on:
  push:
    branches: [agent/manager-operational-release-20261026]
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/aggregate_manager_closure.py
      - app/central_workdays.py
      - app/multibrand_migrations/008_manager_operational_release.sql
      - tests/test_manager_operational_release_browser.py
      - .github/workflows/manager-operational-release.yml
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_enbishan_workflow_controls
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kps_test -d test_enbishan_workflow_controls"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_enbishan_workflow_controls
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/ops.js && node --check public/assets/order-amendments.js && node tests/test_staffing_resume_ui.cjs && node tests/test_driver_shift_guidance.cjs && node tests/test_driver_collection_ui.cjs && node tests/test_collection_exception_ui.cjs && node tests/test_administrative_guidance_ui.cjs && node tests/test_financial_clarifications_ui.cjs
      - run: python -m pytest -q tests/test_aggregate_manager_closure.py tests/test_manager_operational_release_browser.py tests/test_delivery_controls_backup.py tests/test_central_workdays.py tests/test_staffing_read_selectors.py tests/test_employee_permissions.py tests/test_accountant_shift_permissions.py --junitxml=workflow-controls.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-operational-release-${{ github.sha }}
          path: workflow-controls.xml
