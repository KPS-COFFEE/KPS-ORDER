name: Enbishan isolated dual-brand regression
on:
  push:
    branches: [agent/enbishan-isolated-development-20261017]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enbishan-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dual-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_enbishan_ci
          POSTGRES_USER: enbishan_test
          POSTGRES_PASSWORD: synthetic-local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enbishan_test -d test_enbishan_ci"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://enbishan_test:synthetic-local-test-only@127.0.0.1:5432/test_enbishan_ci
      APP_ENV: testing
      TEST_BROWSER: '1'
      OTP_PROVIDER: disabled
      EMAIL_PROVIDER: disabled
      REPORT_WORKER_ENABLED: 'false'
      EMAIL_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Record exact tested revision
        run: |
          mkdir -p test-results/enbishan
          git rev-parse HEAD > test-results/enbishan/revision.txt
      - name: Real dual-brand, financial, security and mobile acceptance
        run: python tools/enbishan_test.py tests/test_enbishan_dual_brand.py tests/test_enbishan_mobile_browser.py
      - name: KPS regression (existing failures remain failures)
        if: ${{ !cancelled() }}
        run: >-
          python -m pytest -q tests/test_storefront_scope.py tests/test_core.py
          tests/test_operations.py tests/test_smart_dispatch.py tests/test_fiscal.py
          tests/test_invoice_profiles.py tests/test_split_payment.py
          tests/test_customer_crm.py tests/test_employee_permissions.py
          --junitxml=test-results/enbishan/kps-regression.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: enbishan-dual-brand-${{ github.sha }}
          path: test-results/
          retention-days: 14
