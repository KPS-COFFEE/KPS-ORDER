name: Enbishan isolated dual-brand regression
on:
  push:
    branches: [agent/enbishan-isolated-development-20261017]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      run_capacity:
        description: Run costly capacity tests only for a justified capacity investigation
        type: boolean
        default: false
      capacity_reason:
        description: Required concrete reason for repeating capacity tests
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: enbishan-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dual-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_enbishan_ci
          POSTGRES_USER: enbishan_test
          POSTGRES_PASSWORD: synthetic-local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enbishan_test -d test_enbishan_ci"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://enbishan_test:synthetic-local-test-only@127.0.0.1:5432/test_enbishan_ci
      APP_ENV: testing
      TEST_BROWSER: '1'
      OTP_PROVIDER: disabled
      EMAIL_PROVIDER: disabled
      REPORT_WORKER_ENABLED: 'false'
      EMAIL_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Record exact tested revision
        run: |
          mkdir -p test-results/enbishan
          git rev-parse HEAD > test-results/enbishan/revision.txt
      - name: Engagement transactions and release-orchestration invariants first
        run: >-
          python -m pytest -q tests/test_customer_engagement_closure.py
          tests/test_customer_engagement_restore.py
          tests/test_enbishan_menu_readiness.py
          tests/test_enbishan_owner_menu_decisions.py
          tests/test_enbishan_operations_preparation.py
          tests/test_enbishan_owner_approved_journey.py
          tests/test_enbishan_storefront_identity.py
          tests/test_enbishan_menu_assets.py
          tests/test_enbishan_customer_scope_constraints.py
          tests/test_enbishan_shared_terminal.py tests/test_enbishan_shared_float.py
          tests/test_enbishan_sms_boundary.py
          tests/test_engagement_capacity_workflow.py tests/test_hosting_report_check.py
          --junitxml=test-results/enbishan/engagement-transactions.xml
      - name: Real dual-brand, financial, security and mobile acceptance
        run: python tools/enbishan_test.py tests/test_enbishan_dual_brand.py tests/test_enbishan_mobile_browser.py tests/test_customer_engagement_browser.py tests/test_enbishan_menu_browser.py tests/test_shift_vehicle.py tests/test_fuel_exceptions.py tests/test_customer_language.py
      - name: KPS regression (existing failures remain failures)
        if: ${{ !cancelled() }}
        run: >-
          python -m pytest -q tests/test_storefront_scope.py tests/test_core.py
          tests/test_operations.py tests/test_smart_dispatch.py tests/test_fiscal.py
          tests/test_invoice_profiles.py tests/test_split_payment.py
          tests/test_customer_crm.py tests/test_employee_permissions.py
          tests/test_context_cookie_isolation.py tests/test_map_resolution_security.py
          tests/test_driver_checks.py tests/test_driver_prelaunch_guards_unit.py
          tests/test_customer_engagement_closure.py
          --junitxml=test-results/enbishan/kps-regression.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: enbishan-dual-brand-${{ github.sha }}
          path: test-results/
          retention-days: 14

  operational-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_operations_candidate
          POSTGRES_USER: operations_test
          POSTGRES_PASSWORD: isolated-synthetic-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U operations_test -d test_operations_candidate"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://operations_test:isolated-synthetic-only@127.0.0.1:5432/test_operations_candidate
      APP_ENV: testing
      RUNTIME_REVISION: ${{ github.sha }}
      OTP_PROVIDER: disabled
      EMAIL_PROVIDER: disabled
      REPORT_WORKER_ENABLED: 'false'
      EMAIL_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Retained payment finance fleet support printing and account regression
        run: >-
          python -m pytest -q
          tests/test_branch_printing.py tests/test_hardening_printing.py tests/test_printer_city.py
          tests/test_shift_vehicle.py tests/test_fleet.py tests/test_fleet_self_service.py
          tests/test_fuel_exceptions.py tests/test_fleet_math.py
          tests/test_order_support.py tests/test_driver_customer_chat.py
          tests/test_accounting.py tests/test_v5_reports.py tests/test_branch_payment_reports.py
          tests/test_branch_payments.py tests/test_branch_checkout.py
          tests/test_branch_payment_webhooks.py tests/test_branch_refunds.py
          tests/test_branch_payment_renewal.py tests/test_branch_payment_policy.py
          tests/test_customer_final_account.py tests/test_customer_experience.py
          tests/test_customer_hotpath.py tests/test_customer_language.py
          tests/test_backup_owner_phone_archive.py tests/test_test_carryover_archive.py
          --junitxml=test-results/operational-regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-candidate-${{ github.sha }}
          path: test-results/
          retention-days: 14
          if-no-files-found: error

  # Reuse the retained workload and real cgroup budgets only AFTER shared
  # functional acceptance succeeds. Larger profiles run only on smaller failure.
  capacity-economy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_capacity && inputs.capacity_reason != '' }}
    needs: [dual-brand, operational-regression]
    name: capacity-economy (${{ matrix.repetition }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_hosting_economy
          POSTGRES_USER: hosting_test
          POSTGRES_PASSWORD: isolated-hosting-only
        ports: ['5432:5432']
        options: >-
          --cpus 0.5 --memory 1g --memory-swap 1g
          --health-cmd "pg_isready -U hosting_test -d test_hosting_economy"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://hosting_test:isolated-hosting-only@127.0.0.1:5432/test_hosting_economy
      KPS_LOAD_RESOURCE_PROFILE: economy
      PYTHONDONTWRITEBYTECODE: '1'
      RUNTIME_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install unchanged pinned requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate fail-closed budget and unchanged workload guards
        run: python -m pytest tests/test_resource_load_profile.py tests/test_hardening_load_observer.py tests/test_hosting_report_check.py -q
      - name: Prepare actual one-core two-GiB application cgroup
        run: |
          mkdir -p test-artifacts
          KPS_LOAD_CGROUP_PATH="/sys/fs/cgroup/kps_order_load_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          printf 'KPS_LOAD_CGROUP_PATH=%s\n' "$KPS_LOAD_CGROUP_PATH" >> "$GITHUB_ENV"
          sudo --preserve-env=GITHUB_ACTIONS,KPS_LOAD_RESOURCE_PROFILE "$(command -v python)" tools/hardening_load.py \
            --prepare-application-cgroup "$KPS_LOAD_CGROUP_PATH" "$(id -u)" "$(id -g)" \
            2>&1 | tee test-artifacts/resource-setup.log
      - name: Retained 50 100 250 500 load, zero errors, recovery and reports
        run: >-
          python tools/hardening_load.py
          --max-error-rate 0
          --application-cgroup "$KPS_LOAD_CGROUP_PATH"
          --database-container '${{ job.services.postgres.id }}'
          --output test-artifacts/economy-${{ matrix.repetition }}.json
      - name: Remove only this run's empty application group
        if: always() && env.KPS_LOAD_CGROUP_PATH != ''
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,KPS_LOAD_RESOURCE_PROFILE "$(command -v python)" tools/hardening_load.py
          --cleanup-application-cgroup "$KPS_LOAD_CGROUP_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosting-economy-${{ matrix.repetition }}
          path: test-artifacts/
          if-no-files-found: error

  capacity-medium:
    name: capacity-medium (${{ matrix.repetition }})
    needs: capacity-economy
    if: ${{ !cancelled() && needs.capacity-economy.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_hosting_medium
          POSTGRES_USER: hosting_test
          POSTGRES_PASSWORD: isolated-hosting-only
        ports: ['5432:5432']
        options: >-
          --cpus 1 --memory 2g --memory-swap 2g
          --health-cmd "pg_isready -U hosting_test -d test_hosting_medium"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://hosting_test:isolated-hosting-only@127.0.0.1:5432/test_hosting_medium
      KPS_LOAD_RESOURCE_PROFILE: medium
      PYTHONDONTWRITEBYTECODE: '1'
      RUNTIME_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install unchanged pinned requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate fail-closed budget and unchanged workload guards
        run: python -m pytest tests/test_resource_load_profile.py tests/test_hardening_load_observer.py tests/test_hosting_report_check.py -q
      - name: Prepare actual one-core two-GiB application cgroup
        run: |
          mkdir -p test-artifacts
          KPS_LOAD_CGROUP_PATH="/sys/fs/cgroup/kps_order_load_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          printf 'KPS_LOAD_CGROUP_PATH=%s\n' "$KPS_LOAD_CGROUP_PATH" >> "$GITHUB_ENV"
          sudo --preserve-env=GITHUB_ACTIONS,KPS_LOAD_RESOURCE_PROFILE "$(command -v python)" tools/hardening_load.py \
            --prepare-application-cgroup "$KPS_LOAD_CGROUP_PATH" "$(id -u)" "$(id -g)" \
            2>&1 | tee test-artifacts/resource-setup.log
      - name: Retained 50 100 250 500 load, zero errors, recovery and reports
        run: >-
          python tools/hardening_load.py
          --max-error-rate 0
          --application-cgroup "$KPS_LOAD_CGROUP_PATH"
          --database-container '${{ job.services.postgres.id }}'
          --output test-artifacts/medium-${{ matrix.repetition }}.json
      - name: Remove only this run's empty application group
        if: always() && env.KPS_LOAD_CGROUP_PATH != ''
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,KPS_LOAD_RESOURCE_PROFILE "$(command -v python)" tools/hardening_load.py
          --cleanup-application-cgroup "$KPS_LOAD_CGROUP_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosting-medium-${{ matrix.repetition }}
          path: test-artifacts/
          if-no-files-found: error

  capacity-proposed:
    name: capacity-proposed (${{ matrix.repetition }})
    needs: capacity-medium
    if: ${{ !cancelled() && needs.capacity-medium.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_hosting_proposed
          POSTGRES_USER: hosting_test
          POSTGRES_PASSWORD: isolated-hosting-only
        ports: ['5432:5432']
        options: >-
          --cpus 1 --memory 2g --memory-swap 2g
          --health-cmd "pg_isready -U hosting_test -d test_hosting_proposed"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://hosting_test:isolated-hosting-only@127.0.0.1:5432/test_hosting_proposed
      KPS_LOAD_RESOURCE_PROFILE: proposed
      PYTHONDONTWRITEBYTECODE: '1'
      RUNTIME_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install unchanged pinned requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate fail-closed budget and unchanged workload guards
        run: python -m pytest tests/test_resource_load_profile.py tests/test_hardening_load_observer.py tests/test_hosting_report_check.py -q
      - name: Prepare actual two-core four-GiB application cgroup
        run: |
          mkdir -p test-artifacts
          KPS_LOAD_CGROUP_PATH="/sys/fs/cgroup/kps_order_load_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          printf 'KPS_LOAD_CGROUP_PATH=%s\n' "$KPS_LOAD_CGROUP_PATH" >> "$GITHUB_ENV"
          sudo --preserve-env=GITHUB_ACTIONS,KPS_LOAD_RESOURCE_PROFILE "$(command -v python)" tools/hardening_load.py \
            --prepare-application-cgroup "$KPS_LOAD_CGROUP_PATH" "$(id -u)" "$(id -g)" \
            2>&1 | tee test-artifacts/resource-setup.log
      - name: Retained 50 100 250 500 load, zero errors, recovery and reports
        run: >-
          python tools/hardening_load.py
          --max-error-rate 0
          --application-cgroup "$KPS_LOAD_CGROUP_PATH"
          --database-container '${{ job.services.postgres.id }}'
          --output test-artifacts/proposed-${{ matrix.repetition }}.json
      - name: Remove only this run's empty application group
        if: always() && env.KPS_LOAD_CGROUP_PATH != ''
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,KPS_LOAD_RESOURCE_PROFILE "$(command -v python)" tools/hardening_load.py
          --cleanup-application-cgroup "$KPS_LOAD_CGROUP_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosting-proposed-${{ matrix.repetition }}
          path: test-artifacts/
          if-no-files-found: error
