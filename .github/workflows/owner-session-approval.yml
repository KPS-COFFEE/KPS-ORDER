name: Owner mobile session approval
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths: [app/auth.py, app/central_staff.py, public/ops.js, public/ops.css, public/ops.html, public/assets/central-operations.js, tests/test_owner_session_approval.py, .github/workflows/owner-session-approval.yml]
permissions:
  contents: read
jobs:
  owner-session-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_owner_session
          POSTGRES_USER: owner_test
          POSTGRES_PASSWORD: isolated-synthetic-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U owner_test -d test_owner_session" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://owner_test:isolated-synthetic-only@127.0.0.1:5432/test_owner_session
      TEST_BROWSER: "1"
      APP_ENV: testing
      RUNTIME_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --test tests/test_employee_live_revocation.cjs tests/test_report_live_revocation.cjs
      - run: node tests/test_mandatory_sms_ui.cjs
      - run: node --check public/ops.js && node --check public/assets/central-operations.js
      - run: python -m pytest -q tests/test_owner_session_approval.py tests/test_employee_live_revocation_browser.py tests/test_owner_sensitive_sms.py tests/test_owner_sms_creation.py tests/test_sms_mandatory_policy.py tests/test_sms_rollout.py tests/test_sms_email_retirement.py tests/test_sms_retirement_brand_scope.py tests/test_owner_staff_management.py tests/test_employee_sms_portals.py --junitxml=test-results/owner-session.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-session-approval-evidence
          path: test-results/owner-session.xml
