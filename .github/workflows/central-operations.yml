name: Central branch operations focused acceptance
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/central_operations.py
      - app/central_workdays.py
      - app/central_staff.py
      - app/central_handovers.py
      - app/central_dashboard.py
      - app/central_driver_overview.py
      - app/central_shift_history.py
      - app/central_fleet.py
      - tools/central_activation_preflight.py
      - app/auth.py
      - app/exports.py
      - app/driver_closure.py
      - public/ops.js
      - tests/test_staff_branch_sms.cjs
      - app/operations.py
      - app/shift_vehicle.py
      - app/multibrand_migrations/**
      - tests/test_central_workdays.py
      - tests/test_central_handovers.py
      - tests/test_central_dashboard.py
      - tests/test_central_driver_overview.py
      - tests/test_central_shift_history.py
      - tests/test_central_activation_preflight.py
      - tests/test_central_workdays_browser.py
      - public/assets/central-operations.js
      - tests/test_central_operations*
      - tests/test_intervention_reachability.cjs
      - tests/test_alert_permission_poll.cjs
      - tests/test_order_interventions.py
      - tests/test_driver_destination_routing.cjs
      - .github/workflows/central-operations.yml
permissions:
  contents: read
concurrency:
  group: central-operations-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  central-branch-scopes:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_enbishan_central
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-synthetic-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test_enbishan_central"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-synthetic-only@127.0.0.1:5432/test_enbishan_central
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: node --test tests/test_staff_branch_sms.cjs
      - run: node --test tests/test_central_operations_adapter.cjs
      - run: node --test tests/test_intervention_reachability.cjs tests/test_alert_permission_poll.cjs
      - run: node --test tests/test_driver_destination_routing.cjs
      - run: node --check public/ops.js
      - run: python tools/enbishan_test.py tests/test_central_operations.py tests/test_order_interventions.py tests/test_central_workdays.py tests/test_central_handovers.py tests/test_central_dashboard.py tests/test_central_driver_overview.py tests/test_central_shift_history.py tests/test_central_activation_preflight.py tests/test_enbishan_dual_brand.py tests/test_multibrand_final_boundary.py

      - name: Bound Ubuntu dependency downloads on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          # Keep Ubuntu suites, components and signing keys unchanged. Only the
          # slow Azure mirror host is replaced with the official Ubuntu archive.
          configured=false
          processed=0
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's#://azure\.archive\.ubuntu\.com/#://archive.ubuntu.com/#g' "$source"
              # A local mirrorlist can select Azure even when the sources file
              # itself has no Azure URL. Verify every observed configuration path.
              sudo awk 'index($0,"azure.archive.ubuntu.com") { found=1 } END { exit found ? 1 : 0 }' "$source"
              configured=true
              processed=$((processed+1))
            fi
          done
          if [ "$configured" != true ]; then
            echo 'Expected Ubuntu APT sources were not found.' >&2
            exit 1
          fi
          sudo tee /etc/apt/apt.conf.d/99-kps-ci-network > /dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          printf 'Ubuntu APT source files verified: %s\n' "$processed"
      - run: python -m playwright install --with-deps chromium
      - run: python tools/enbishan_test.py tests/test_central_workdays_browser.py
        env:
          TEST_BROWSER: "1"

