name: Driver owner-managed ring acceptance
on:
  push:
    branches: [agent/driver-order-sound-20261024]
  pull_request:
    paths: ['app/driver_order_sounds.py', 'tests/test_driver_order_sounds.py', 'migrations/098_driver_order_audio.sql']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_driver_sound
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_driver_sound" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_driver_sound
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: node --check public/ops.js
      - run: node tests/test_alert_schedule_ui.cjs
      - run: python -m pytest -q tests/test_driver_order_sounds.py tests/test_alert_policy.py --junitxml=test-results/driver-sound.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-sound-acceptance
          path: test-results/driver-sound.xml
