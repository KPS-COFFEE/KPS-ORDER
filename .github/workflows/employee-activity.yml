name: Owner employee activity
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  employee-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: activity-test-only
          POSTGRES_DB: test_activity
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:activity-test-only@127.0.0.1:5432/test_activity
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_employee_activity.py tests/test_context_cookie_isolation.py tests/test_accountant_shift_permissions.py
      - run: node --check public/ops.js && node --check public/employee-activity.js
