name: Driver float and privacy acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  driver-float-postgres:
    if: github.head_ref == 'agent/role-workspaces-20261102' || github.head_ref == 'agent/order-journey-closure-20261101' || github.head_ref == 'agent/kps-order-emergency-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_kps_order
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kps_test -d test_kps_order"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_kps_order
      TEST_BROWSER: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_fuel_exceptions.py tests/test_simple_driver_close.py tests/test_driver_closure_browser.py tests/test_driver_cash_handover.py tests/test_browser.py::test_real_all_staff_roles_driver_manager_closures_and_saved_report_files tests/test_v5_operations.py::test_multi_branch_one_shift_revocation_preserves_task_custody_and_draft tests/test_driver_breaks.py tests/test_driver_evidence.py tests/test_shift_vehicle.py tests/test_vehicle_maintenance.py tests/test_smart_dispatch.py tests/test_driver_simple_browser.py tests/test_driver_camera_browser.py tests/test_driver_float.py tests/test_blind_driver_closure_unit.py tests/test_operations.py tests/test_accounting.py tests/test_driver_incentives_unit.py --junitxml=driver-float-results.xml
      - run: node tests/test_driver_simple_ui.cjs && node tests/test_blind_driver_closure_ui.cjs && node tests/test_driver_alerts_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-float-acceptance-${{ github.event.pull_request.head.sha }}
          path: |
            driver-float-results.xml
            test-artifacts/driver-simple/
            test-artifacts/TEST_ONLY_fuel*.png
