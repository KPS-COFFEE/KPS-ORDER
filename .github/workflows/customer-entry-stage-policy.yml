name: Customer entry and stage timing acceptance
on:
  push:
    branches: [agent/customer-journey-stage-policy-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_customer_entry
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_customer_entry" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_customer_entry
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/customer.js && node --check public/ops.js && node --check public/assets/experience-policy.js && node --check public/assets/first-order-gift.js && node --check public/assets/banner-device-preview.js && node --check public/assets/morning-delivery.js
      - run: python -m pytest -q tests/test_morning_delivery.py tests/test_morning_delivery_postgres.py tests/test_manager_acceptance_postgres.py tests/test_banner_device_preview_browser.py tests/test_first_order_gift.py tests/test_first_order_gift_postgres.py tests/test_core.py tests/test_experience_policy.py tests/test_experience_policy_postgres.py tests/test_customer_progress.py tests/test_customer_progress_postgres.py tests/test_experience_entry_browser.py --junitxml=test-results/customer-entry.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-entry-evidence
          path: |
            test-results/customer-entry.xml
            test-results/customer-entry-*.png
