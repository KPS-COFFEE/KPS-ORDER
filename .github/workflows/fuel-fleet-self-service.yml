name: Fuel and fleet self-service acceptance
on:
  push:
    branches: [agent/kps-order-emergency-v4]
    paths: [.github/workflows/fuel-fleet-self-service.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_owner_sms
          POSTGRES_USER: owner_sms_test
          POSTGRES_PASSWORD: isolated-owner-sms-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U owner_sms_test -d test_owner_sms" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://owner_sms_test:isolated-owner-sms-only@127.0.0.1:5432/test_owner_sms
      TEST_BROWSER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6982f35811684a36883a2e2691c342bf7ebe7072
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install isolated browser
        run: python -m playwright install --with-deps chromium
      - name: Verify source, fuel and fleet transitions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6982f35811684a36883a2e2691c342bf7ebe7072"
          node --check public/ops.js
          node --check public/assets/driver-checks.js
          python -m pytest -q --tb=short --junitxml=test-results/fuel-fleet.xml tests/test_driver_checks.py tests/test_driver_checks_browser.py tests/test_fleet_self_service.py tests/test_fleet.py tests/test_fleet_math.py tests/test_fleet_browser.py tests/test_fuel_exceptions.py tests/test_shift_vehicle.py tests/test_employee_permissions.py tests/test_operations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuel-fleet-6982f35811684a36883a2e2691c342bf7ebe7072
          path: |
            test-results/
            test-artifacts/
          retention-days: 14
