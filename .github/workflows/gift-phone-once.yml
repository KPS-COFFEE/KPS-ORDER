name: Gift once per verified phone and Friday hours
on:
  push:
    branches: [agent/gift-launch-phone-20261022]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gift-phone-once-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gift-phone-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_gift_phone_once
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_gift_phone_once" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_gift_phone_once
      APP_ENV: testing
      OTP_PROVIDER: disabled
      EMAIL_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Gift normalization, identity recreation, concurrent redemption and Friday admission
        run: >-
          python -m pytest -q
          tests/test_first_order_gift.py tests/test_first_order_gift_postgres.py
          tests/test_branch_opening_hours.py tests/test_morning_delivery.py
          tests/test_morning_delivery_postgres.py tests/test_storefront_advertising.py
          tests/test_storefront_advertising_postgres.py
          --junitxml=test-results/gift-phone-once.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gift-phone-once-evidence
          path: test-results/gift-phone-once.xml
          retention-days: 14
