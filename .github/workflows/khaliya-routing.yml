name: Khaliya routing acceptance
on:
  push:
    branches: [agent/kps-khaliya-routing]
  pull_request:
    paths: [app/catalog.py, app/orders.py, app/chat.py, public/customer.js, tests/test_khaliya_routing.py, tests/test_khaliya_routing_browser.py, .github/workflows/khaliya-routing.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_khaliya
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_khaliya" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_khaliya
      TEST_BROWSER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q app tests && node --check public/customer.js
      - run: python -m pytest -q tests/test_khaliya_routing.py tests/test_khaliya_routing_source.py tests/test_khaliya_routing_browser.py tests/test_final_catalog.py tests/test_core.py tests/test_launch_branches.py tests/test_dispatch_numbering.py tests/test_order_support.py --junitxml=test-results/khaliya.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khaliya-acceptance
          path: |
            test-results/
            test-artifacts/
