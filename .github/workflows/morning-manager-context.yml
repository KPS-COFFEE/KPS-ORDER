name: Scoped morning manager acceptance
on:
  push:
    branches: [agent/morning-manager-context-20261021]
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_morning_manager_context
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_morning_manager_context" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_morning_manager_context
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: node --check public/ops.js
      - run: python -m compileall -q app
      - run: python -m pytest -q tests/test_morning_manager_context.py tests/test_morning_manager_context_postgres.py tests/test_morning_delivery.py tests/test_employee_permissions.py tests/test_driver_configuration_lock.py --junitxml=test-results/morning-manager.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morning-manager-evidence
          path: |
            test-results/morning-manager.xml
          retention-days: 7
