name: Delivery workflow controls acceptance
on:
  push:
    branches: [agent/delivery-workflow-controls-20261025]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_workflow_controls
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kps_test -d test_workflow_controls"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_workflow_controls
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/ops.js && node --check public/assets/order-amendments.js && node tests/test_driver_collection_ui.cjs && node tests/test_collection_exception_ui.cjs && node tests/test_administrative_guidance_ui.cjs
      - run: python -m pytest -q tests/test_aggregate_driver_closure.py tests/test_driver_duty.py tests/test_driver_physical_admission.py tests/test_financial_gap_controls.py tests/test_administrative_guidance.py tests/test_delivery_hours.py tests/test_central_workdays.py tests/test_central_workdays_browser.py tests/test_driver_closure_direct_paths.py tests/test_delivery_workflow_controls.py tests/test_split_payment.py tests/test_split_payment_browser.py tests/test_order_financial_cases.py tests/test_operations.py tests/test_accounting.py tests/test_accountant_shift_permissions.py tests/test_driver_accounting_settlements.py tests/test_order_support.py tests/test_order_financial_case_morning.py --junitxml=workflow-controls.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-workflow-controls-${{ github.sha }}
          path: workflow-controls.xml
