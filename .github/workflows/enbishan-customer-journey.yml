name: Enbishan customer journey and SMS verification
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/auth.py
      - migrations/126_enbishan_customer_sms_required.sql
      - tests/test_enbishan_mandatory_customer_sms.py
      - tests/test_enbishan_verified_checkout_ui.cjs
      - tests/test_customer_checkout_quote_race.cjs
      - tests/test_enbishan_dual_brand.py
      - public/assets/enbishan-menu.js
      - public/assets/customer-order.js
      - tests/test_enbishan_approved_menu_staff_browser.py
      - public/customer.js
      - public/customer.css
      - public/assets/enbishan.css
      - public/index.html
      - app/catalog.py
      - app/enbishan_menu_assets.json
      - public/assets/enbishan-menu/**
      - migrations/109_enbishan_family_menu_clarity.sql
      - migrations/110_enbishan_family_commercial_approval.sql
      - migrations/111_enbishan_flavours_and_citrus.sql
      - migrations/112_enbishan_product_artwork.sql
      - migrations/113_enbishan_khaliya_offer.sql
      - migrations/123_enbishan_approved_small_plates.sql
      - migrations/125_enbishan_single_or_two_flavours.sql
      - tests/test_enbishan_catalog_presentation.cjs
      - tests/test_enbishan_approved_small_plates.py
      - tests/test_enbishan_flavour_decision.py
      - tests/test_enbishan_family_menu_clarity.py
      - tests/test_enbishan_size_clarity_browser.py
      - migrations/103_enbishan_pickup_default_paused.sql
      - tests/test_enbishan_approved_journey*
      - migrations/098_enbishan_guest_checkout.sql
      - tests/test_enbishan_journey.*
      - .github/workflows/enbishan-customer-journey.yml
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_enbishan_journey
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_enbishan_journey" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_enbishan_journey
      APP_ENV: testing
      SESSION_COOKIE_SECURE: 'false'
      OTP_PROVIDER: disabled
      INITIAL_CATALOG_IMPORT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: node --check public/customer.js
      - run: node tests/test_enbishan_catalog_presentation.cjs
      - run: node tests/test_enbishan_journey.cjs
      - run: node --test tests/test_enbishan_verified_checkout_ui.cjs tests/test_checkout_attempts.cjs tests/test_customer_checkout_quote_race.cjs
      - run: python -m pytest -q tests/test_enbishan_mandatory_customer_sms.py tests/test_enbishan_sms_boundary.py tests/test_enbishan_otp_provider_gate.py tests/test_enbishan_dual_brand.py
      - run: python -m pytest -q tests/test_enbishan_approved_small_plates.py tests/test_enbishan_journey.py tests/test_enbishan_approved_journey.py tests/test_enbishan_family_menu_clarity.py tests/test_enbishan_flavour_decision.py tests/test_guest_session_policy.py tests/test_customer_neighborhood_policy.py tests/test_customer_card_quantity.py tests/test_optional_customer_address.py tests/test_enbishan_customer_scope_constraints.py tests/test_customer_hotpath.py tests/test_customer_language.py::test_customer_translation_codes_are_complete_and_keep_approved_source_immutable
      - name: Install Chromium dependencies
        run: python -m playwright install --with-deps chromium
      - name: Verify approved journey in Arabic mobile and English desktop
        run: TEST_BROWSER=1 python -m pytest -q tests/test_enbishan_approved_journey_browser.py tests/test_enbishan_size_clarity_browser.py tests/test_enbishan_approved_menu_staff_browser.py

