name: Map services acceptance
on:
  push:
    branches: [agent/kps-map-services-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_map_services
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_map_services" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_map_services
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/ops.js && node --check public/assets/dispatch-map.js && node --check public/assets/delivery-track.js
      - run: python -m pytest -q tests/test_map_services.py tests/test_driver_locations.py tests/test_driver_routes.py tests/test_driver_gps_browser.py tests/test_dispatch_map_browser.py tests/test_order_tracking_browser.py tests/test_smart_dispatch.py tests/test_backup.py --junitxml=test-results/map-services.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-services-evidence
          path: test-results/
