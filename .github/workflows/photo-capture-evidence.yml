name: Photo capture evidence acceptance
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/route_eta.py
      - app/order_amendments.py
      - app/order_requests.py
      - public/assets/dispatch-impact.js
      - public/assets/order-interventions.js
      - public/assets/order-amendments.js
      - tests/test_dispatch_history_privacy.py
      - tests/test_intervention_reachability_browser.py
      - tests/test_intervention_reachability.cjs
      - tests/test_order_requests.py
      - tests/test_order_amendments.py
      - tests/test_route_eta_unit.py
      - app/journey_timing.py
      - app/performance.py
      - app/dispatch_impact.py
      - app/order_interventions.py
      - app/orders.py
      - app/operations.py
      - app/branch_printing.py
      - app/order_financial_cases.py
      - migrations/129_dispatch_impact.sql
      - tests/test_journey_timing.py
      - tests/test_dispatch_impact*
      - tests/test_order_interventions.py
      - app/photo_location.py
      - app/order_support.py
      - app/reporting.py
      - migrations/128_photo_capture_location.sql
      - public/ops.js
      - public/ops.html
      - public/assets/photo-location.js
      - tests/test_photo_location*
      - .github/workflows/photo-capture-evidence.yml
permissions:
  contents: read
jobs:
  capture-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_enbishan_delivery_journey
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_enbishan_delivery_journey" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_enbishan_delivery_journey
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/ops.js && node --test tests/test_photo_location.cjs tests/test_employee_live_revocation.cjs tests/test_dispatch_impact_ui.cjs tests/test_intervention_reachability.cjs
      - run: >-
          python -m pytest -q tests/test_photo_location.py tests/test_photo_location_postgres.py
          tests/test_dispatch_history_privacy.py tests/test_intervention_reachability_browser.py
          tests/test_journey_timing.py tests/test_dispatch_impact.py tests/test_dispatch_impact_postgres.py
          tests/test_order_interventions.py tests/test_order_requests.py
          tests/test_order_amendments.py tests/test_order_financial_cases.py
          tests/test_order_support.py tests/test_photo_observations.py
          tests/test_driver_camera_browser.py tests/test_employee_live_revocation_browser.py tests/test_route_eta_unit.py tests/test_driver_auto_return.py
          --junitxml=test-results/photo-capture.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-capture-${{ github.event.pull_request.head.sha }}
          path: test-results/
