name: Order amendment acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  amendments-postgres:
    if: github.head_ref == 'agent/order-duplicate-partial-20261026' || github.head_ref == 'agent/kps-order-emergency-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_kps_order
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kps_test -d test_kps_order"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_kps_order
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_order_amendments.py tests/test_amendment_editor_browser.py tests/test_operations.py tests/test_accounting.py tests/test_driver_incentives_unit.py tests/test_branch_printing.py tests/test_delivery_center_matching.py --junitxml=amendment-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amendment-acceptance-${{ github.event.pull_request.head.sha }}
          path: amendment-results.xml
