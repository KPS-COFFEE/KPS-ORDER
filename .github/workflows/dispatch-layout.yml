name: Delivery personal layout acceptance
on:
  push:
    branches: [agent/dispatch-personal-layout-20261021]
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths: [public/assets/dispatch-layout.*, public/ops.js, public/ops.css, public/ops.html, app/manager_workday.py, tests/test_dispatch_workspace_counts.py, tests/test_order_amendments.py, tests/test_delivery_workspace_browser.py, .github/workflows/dispatch-layout.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_dispatch_layout
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_dispatch_layout" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_dispatch_layout
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Bound Ubuntu dependency downloads on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          # Keep Ubuntu suites, components and signing keys unchanged. Only the
          # slow Azure mirror host is replaced with the official Ubuntu archive.
          configured=false
          processed=0
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's#://azure\.archive\.ubuntu\.com/#://archive.ubuntu.com/#g' "$source"
              # A local mirrorlist can select Azure even when the sources file
              # itself has no Azure URL. Verify every observed configuration path.
              sudo awk 'index($0,"azure.archive.ubuntu.com") { found=1 } END { exit found ? 1 : 0 }' "$source"
              configured=true
              processed=$((processed+1))
            fi
          done
          if [ "$configured" != true ]; then
            echo 'Expected Ubuntu APT sources were not found.' >&2
            exit 1
          fi
          sudo tee /etc/apt/apt.conf.d/99-kps-ci-network > /dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          printf 'Ubuntu APT source files verified: %s\n' "$processed"
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/assets/dispatch-layout.js && node --check public/ops.js
      - run: python -m pytest -q tests/test_delivery_workspace_browser.py tests/test_dispatch_workspace_counts.py tests/test_order_amendments.py tests/test_delivery_center_matching.py tests/test_dispatch_order_sort.py tests/test_delivery_manager_operations_only.py tests/test_dispatch_map_browser.py --junitxml=test-results/dispatch-layout.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatch-layout-evidence
          path: test-results/
