name: Delivery personal layout acceptance
on:
  push:
    branches: [agent/dispatch-personal-layout-20261021]
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths: [public/assets/dispatch-layout.*, public/ops.js, public/ops.html, tests/test_delivery_workspace_browser.py, .github/workflows/dispatch-layout.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_dispatch_layout
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_dispatch_layout" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_dispatch_layout
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/assets/dispatch-layout.js && node --check public/ops.js
      - run: python -m pytest -q tests/test_delivery_workspace_browser.py tests/test_dispatch_workspace_counts.py tests/test_dispatch_order_sort.py tests/test_delivery_manager_operations_only.py tests/test_dispatch_map_browser.py --junitxml=test-results/dispatch-layout.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatch-layout-evidence
          path: test-results/
