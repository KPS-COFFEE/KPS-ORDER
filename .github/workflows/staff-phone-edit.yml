name: Staff phone paste and editing acceptance
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths: [public/assets/customer-order.js, tests/test_staff_phone_edit_browser.py, .github/workflows/staff-phone-edit.yml]
permissions:
  contents: read
jobs:
  phone-edit-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium webkit
      - run: node --check public/assets/customer-order.js
      - run: python -m pytest -q tests/test_staff_phone_edit_browser.py --junitxml=test-results/phone-edit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-phone-edit-evidence
          path: test-results/
