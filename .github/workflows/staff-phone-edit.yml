name: Staff phone paste and editing acceptance
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths: [public/assets/customer-order.js, tests/test_staff_phone_edit_browser.py, .github/workflows/staff-phone-edit.yml]
permissions:
  contents: read
jobs:
  phone-edit-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Bound Ubuntu dependency downloads on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          # Keep Ubuntu suites, components and signing keys unchanged. Only the
          # slow Azure mirror host is replaced with the official Ubuntu archive.
          configured=false
          processed=0
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's#://azure\.archive\.ubuntu\.com/#://archive.ubuntu.com/#g' "$source"
              # A local mirrorlist can select Azure even when the sources file
              # itself has no Azure URL. Verify every observed configuration path.
              sudo awk 'index($0,"azure.archive.ubuntu.com") { found=1 } END { exit found ? 1 : 0 }' "$source"
              configured=true
              processed=$((processed+1))
            fi
          done
          if [ "$configured" != true ]; then
            echo 'Expected Ubuntu APT sources were not found.' >&2
            exit 1
          fi
          sudo tee /etc/apt/apt.conf.d/99-kps-ci-network > /dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          printf 'Ubuntu APT source files verified: %s\n' "$processed"
      - run: python -m playwright install --with-deps chromium webkit
      - run: node --check public/assets/customer-order.js
      - run: python -m pytest -q tests/test_staff_phone_edit_browser.py --junitxml=test-results/phone-edit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-phone-edit-evidence
          path: test-results/
