name: Driver payment focused acceptance
on:
  push:
    branches: [agent/kps-driver-payment-hotfix-20261018]
permissions:
  contents: read
jobs:
  payment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_driver_payment
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kps_test -d test_driver_payment"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_driver_payment
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node tests/test_driver_collection_ui.cjs && node tests/test_driver_simple_ui.cjs && node --check public/ops.js
      - run: python -m pytest -q tests/test_split_payment.py tests/test_split_payment_browser.py tests/test_operations.py tests/test_hardening_operations.py tests/test_driver_cash_handover.py tests/test_simple_driver_close.py tests/test_driver_float.py tests/test_blind_driver_closure_unit.py --junitxml=driver-payment-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-payment-results
          path: driver-payment-results.xml
