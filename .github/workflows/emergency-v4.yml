name: KPS ORDER Independent V5

"on":
  push:
    branches:
      - agent/kps-order-emergency-v4
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: kps-order-emergency-v4-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-print-bridge:
    if: github.event_name == 'push' || github.head_ref == 'agent/kps-order-emergency-v4'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile Windows bridge and check logo and JSON
        shell: pwsh
        run: |
          Set-Location tools/windows-print-bridge
          Copy-Item ../../public/assets/kps-receipt-logo.png logo.png
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:KpsPrintBridge.exe /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /reference:System.Security.dll KpsPrintBridge.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./KpsPrintBridge.exe --self-test
          exit $LASTEXITCODE
  independent-postgres-regression:
    # pull_request branch filters target branches. This gate restricts execution
    # to the emergency source branch without changing legacy integrations.
    if: github.event_name == 'push' || github.head_ref == 'agent/kps-order-emergency-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_kps_order
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kps_test -d test_kps_order"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Synthetic, ephemeral CI credentials only. No Render/production secrets.
      DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_kps_order
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_kps_order
      APP_ENV: testing
      PUBLIC_BASE_URL: http://testserver
      APP_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      SESSION_COOKIE_SECURE: "false"
      OTP_PROVIDER: disabled
      INITIAL_CATALOG_IMPORT: "true"
      RUNTIME_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      # Browser tests must launch real Chromium against the isolated app/DB.
      # No provider credentials or intercepted API responses are used.
      TEST_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Select affected regression scope
        id: scope
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines())
          # Guest-session changes do not require replaying catalog, printing,
          # dispatch, maintenance and report suites. Unknown changes stay full.
          identity_files = {
              'app/auth.py', 'tests/test_guest_session_policy.py',
              'tests/test_v5_identity.py', '.github/workflows/emergency-v4.yml',
              'public/ops.js', 'tests/test_owner_driver_activation.py',
              'tests/test_owner_staff_management.py',
          }
          focused = 'app/auth.py' in changed and changed <= identity_files
          operation_files = {
              'Dockerfile',
              'app/auth.py', 'app/admin.py', 'app/operations.py', 'app/main.py',
              'app/exports.py', 'app/branch_printing.py', 'migrations/024_branch_printing.sql',
              'migrations/025_printer_acceptance.sql',
              'public/ops.js', 'public/customer.js', 'public/index.html',
              'tests/test_branch_printing.py', 'tests/test_launch_admin.py',
              'tests/test_receipt_customer_privacy.py', 'tests/test_thermal_receipt_browser.py',
              'tools/windows-print-bridge/KpsPrintBridge.cs',
              'tools/windows-print-bridge/Start.cmd', 'tools/windows-print-bridge/README.txt',
              '.github/workflows/emergency-v4.yml',
          }
          operations = bool(changed) and changed <= operation_files and not focused
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('identity_only=' + str(focused).lower() + '\n')
              output.write('operations_only=' + str(operations).lower() + '\n')
          print('Identity/access regression' if focused else 'Full regression')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned application and test requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium and required system libraries
        run: python -m playwright install --with-deps chromium
      - name: Check Python and browser script syntax
        shell: bash
        run: |
          python -m compileall -q app tools tests
          for script in public/*.js; do
            node --check "$script"
          done
          git diff --check
      - name: Run temporary dispatch and numbering acceptance
        if: steps.scope.outputs.identity_only != 'true' && steps.scope.outputs.operations_only != 'true'
        run: python -m pytest -q --strict-markers tests/test_dispatch_numbering.py tests/test_driver_configuration_lock.py tests/test_driver_configuration_browser.py --junitxml=test-results/dispatch-numbering.xml
      - name: Run scoped bilingual vehicle maintenance acceptance
        if: steps.scope.outputs.identity_only != 'true' && steps.scope.outputs.operations_only != 'true'
        run: >-
          python -m pytest -q --strict-markers
          tests/test_vehicle_maintenance.py tests/test_vehicle_maintenance_browser.py
          --junitxml=test-results/vehicle-maintenance.xml
      - name: Run focused launch, access and delivery-hours checks
        if: steps.scope.outputs.identity_only != 'true' && steps.scope.outputs.operations_only != 'true'
        run: >-
          python -m pytest -q --strict-markers
          tests/test_launch_admin.py tests/test_launch_branches.py
          tests/test_launch_browser.py tests/test_delivery_hours.py
          tests/test_homepage_presentation.py
          tests/test_identity_closure.py tests/test_owner_closure.py
          tests/test_branch_location_import.py tests/test_monitoring.py
          tests/test_owner_closure_browser.py tests/test_customer_language.py
          tests/test_staff_invitation_browser.py
          --junitxml=test-results/launch-focused.xml
      - name: Run isolated PostgreSQL 18 and source regression
        if: steps.scope.outputs.identity_only != 'true' && steps.scope.outputs.operations_only != 'true'
        run: python -m pytest -q --strict-markers --junitxml=test-results/v5.xml
      - name: Run focused identity, sessions, ownership and browser regression
        if: steps.scope.outputs.identity_only == 'true'
        run: >-
          python -m pytest -q --strict-markers
          tests/test_guest_session_policy.py tests/test_core.py
          tests/test_owner_driver_activation.py tests/test_owner_staff_management.py
          tests/test_v5_identity.py tests/test_final_identity.py
          tests/test_identity_closure.py tests/test_owner_closure.py
          tests/test_browser.py tests/test_staff_invitation_browser.py
          --junitxml=test-results/identity-focused.xml
      - name: Run affected driver, permissions, printing, receipt and restore checks
        if: steps.scope.outputs.operations_only == 'true'
        run: >-
          python -m pytest -q --strict-markers
          tests/test_branch_printing.py tests/test_receipt_customer_privacy.py
          tests/test_thermal_receipt_browser.py tests/test_driver_configuration_lock.py
          tests/test_driver_configuration_browser.py tests/test_operations.py
          tests/test_launch_admin.py tests/test_launch_branches.py tests/test_launch_browser.py
          tests/test_backup.py tests/test_v5_identity.py tests/test_dispatch_numbering.py
          --junitxml=test-results/operations-focused.xml
      - name: Retain synthetic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-test-results
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Retain actual browser emulation screenshots and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-browser-evidence
          # Only explicit synthetic-data browser evidence. Never upload the
          # repository, environment files, credentials or operational backups.
          path: |
            test-artifacts/*.png
            test-artifacts/*.json
            test-artifacts/*.pdf
            test-artifacts/*.csv
            test-artifacts/v5-reports/**
          if-no-files-found: warn
          retention-days: 7
      - name: Publish allowlisted synthetic UI evidence checksums
        if: always()
        # Original PNGs remain in the authenticated artifact above. Compact
        # checksums keep decoded job logs readable without duplicate image bytes.
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const names = ['original-store-1280.png', 'original-menu-390.png', 'charcoal-menu-390.png', 'charcoal-store-1280.png', 'charcoal-khaliya-390.png', 'charcoal-owner-appearance-1280.png', 'original-restored-1280.png', 'final-khaliya-single-card-390.png', 'final-khaliya-single-card-1280.png', 'final-khaliya-required-types-390.png', 'final-khaliya-required-types-1280.png', 'final-registered-mobile-login-390-390.png', 'final-registered-mobile-login-1280-1280.png', 'text-only-strip-390.png', 'text-only-strip-1280.png', 'text-only-strip-owner-1280.png', 'text-strip-paused-390.png', 'text-strip-paused-1280.png', 'launch-nearest-delivery-390.png', 'launch-location-denied-manual-390.png', 'launch-owner-banner-1280.png',
            'owner-original-image-draft-390.png', 'owner-original-image-draft-1280.png', 'customer-black-paused-blue-available-390.png', 'customer-black-paused-blue-available-1280.png', 'owner-black-branch-one-only-390.png', 'owner-black-branch-one-only-1280.png', 'owner-item-control-english-390.png', 'owner-item-control-english-1280.png',
            'customer-language-ar-390.png', 'customer-language-ar-1280.png', 'customer-language-en-390.png', 'customer-language-en-1280.png', 'customer-language-en-order-390.png', 'customer-language-en-order-1280.png', 'customer-language-en-chat-390.png', 'customer-language-en-chat-1280.png'];
          for (const name of names) {
            const path = 'test-artifacts/' + name;
            if (fs.existsSync(path)) { const bytes = fs.readFileSync(path); console.log('KPS_PUBLIC_UI_EVIDENCE ' + JSON.stringify({name, synthetic: true, revision: process.env.RUNTIME_REVISION, size_bytes: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex')})); }
          }
          NODE
