        run: python -m pytest -q --strict-markers tests/test_owner_staff_management.py tests/test_branch_printing.py --junitxml=test-results/staff-focused.xml
      - name: Run affected driver, permissions, printing, receipt and restore checks
        if: steps.scope.outputs.operations_only == 'true'
        run: >-
          python -m pytest -q --strict-markers
          tests/test_branch_printing.py tests/test_receipt_customer_privacy.py
          tests/test_invoice_profiles.py
          tests/test_thermal_receipt_browser.py tests/test_driver_configuration_lock.py
          tests/test_driver_configuration_browser.py tests/test_operations.py
          tests/test_launch_admin.py tests/test_launch_branches.py tests/test_launch_browser.py
          tests/test_backup.py tests/test_v5_identity.py tests/test_dispatch_numbering.py
          --junitxml=test-results/operations-focused.xml
      - name: Retain synthetic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-test-results-${{ matrix.shard }}
          path: |
            test-results/*.xml
            test-results/full-shard-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain actual browser emulation screenshots and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-browser-evidence-${{ matrix.shard }}
          # Only explicit synthetic-data browser evidence. Never upload the
          # repository, environment files, credentials or operational backups.
          path: |
            test-artifacts/*.png
            test-artifacts/*.json
            test-artifacts/*.pdf
            test-artifacts/*.csv
            test-artifacts/v5-reports/**
          if-no-files-found: warn
          retention-days: 7
      - name: Publish allowlisted synthetic UI evidence checksums
        if: always()
        # Original PNGs remain in the authenticated artifact above. Compact
        # checksums keep decoded job logs readable without duplicate image bytes.
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const names = ['original-store-1280.png', 'original-menu-390.png', 'charcoal-menu-390.png', 'charcoal-store-1280.png', 'charcoal-khaliya-390.png', 'charcoal-owner-appearance-1280.png', 'original-restored-1280.png', 'final-khaliya-single-card-390.png', 'final-khaliya-single-card-1280.png', 'final-khaliya-required-types-390.png', 'final-khaliya-required-types-1280.png', 'final-registered-mobile-login-390-390.png', 'final-registered-mobile-login-1280-1280.png', 'text-only-strip-390.png', 'text-only-strip-1280.png', 'text-only-strip-owner-1280.png', 'text-strip-paused-390.png', 'text-strip-paused-1280.png', 'launch-nearest-delivery-390.png', 'launch-location-denied-manual-390.png', 'launch-owner-banner-1280.png',
            'owner-original-image-draft-390.png', 'owner-original-image-draft-1280.png', 'customer-black-paused-blue-available-390.png', 'customer-black-paused-blue-available-1280.png', 'owner-black-branch-one-only-390.png', 'owner-black-branch-one-only-1280.png', 'owner-item-control-english-390.png', 'owner-item-control-english-1280.png',
            'customer-language-ar-390.png', 'customer-language-ar-1280.png', 'customer-language-en-390.png', 'customer-language-en-1280.png', 'customer-language-en-order-390.png', 'customer-language-en-order-1280.png', 'customer-language-en-chat-390.png', 'customer-language-en-chat-1280.png'];
          for (const name of names) {
            const path = 'test-artifacts/' + name;
            if (fs.existsSync(path)) { const bytes = fs.readFileSync(path); console.log('KPS_PUBLIC_UI_EVIDENCE ' + JSON.stringify({name, synthetic: true, revision: process.env.RUNTIME_REVISION, size_bytes: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex')})); }
          }
          NODE

  focused-staff-journeys:
    # Additional early feedback only; all full shards and their aggregate gate
    # remain mandatory and retain their existing exact coverage manifests.
    if: "!cancelled() && (github.event_name == 'push' || github.head_ref == 'agent/kps-order-emergency-v4' || github.head_ref == 'agent/kps-map-services-20261022' || github.head_ref == 'agent/customer-map-autosave-20261022' || github.head_ref == 'agent/optional-customer-address-20261021' || github.head_ref == 'agent/accountant-driver-settlement-20261021' || github.head_ref == 'agent/accounting-driver-statements-20261022' || github.head_ref == 'agent/accounting-deadlines-20261022' || github.head_ref == 'agent/owner-test-void-20261022' || github.head_ref == 'agent/ops-actionable-alerts-20261020' || github.head_ref == 'agent/staff-operations-room-20261020' || github.head_ref == 'agent/morning-manager-ahmed-trial-20261021' || github.head_ref == 'agent/morning-night-trial-20261021' || github.head_ref == 'agent/morning-auto-dispatch-20261022' || github.head_ref == 'agent/morning-live-bells-20261022' || github.head_ref == 'agent/morning-role-guide-20261022' || github.head_ref == 'agent/gift-launch-phone-20261022' || github.head_ref == 'agent/phone-paste-edit-fix-20261022' || github.head_ref == 'agent/manager-order-return-20261022' || github.head_ref == 'agent/morning-manager-permission-parity-20261022' || github.head_ref == 'agent/owner-ops-confirmation-20261022' || github.head_ref == 'agent/fleet-active-swap-20261022' || github.head_ref == 'agent/ops-approved-integration-20261022' || github.head_ref == 'agent/task-recovery-screen-20261023' || github.head_ref == 'agent/multibrand-safe-release-20261023' || github.head_ref == 'agent/central-branch-operations-20261023' || github.head_ref == 'agent/central-shared-workday-20261024')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_enbishan_kps_regression
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kps_test -d test_enbishan_kps_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_enbishan_kps_regression
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_enbishan_kps_regression
      APP_ENV: testing
      PUBLIC_BASE_URL: http://testserver
      APP_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      SESSION_COOKIE_SECURE: "false"
      OTP_PROVIDER: disabled
      INITIAL_CATALOG_IMPORT: "true"
      RUNTIME_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      TEST_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned application and test requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Bound Ubuntu dependency downloads on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          # Keep Ubuntu suites, components and signing keys unchanged. Only the
          # slow Azure mirror host is replaced with the official Ubuntu archive.
          configured=false
          processed=0
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's#://azure\.archive\.ubuntu\.com/#://archive.ubuntu.com/#g' "$source"
              # A local mirrorlist can select Azure even when the sources file
              # itself has no Azure URL. Verify every observed configuration path.
              sudo awk 'index($0,"azure.archive.ubuntu.com") { found=1 } END { exit found ? 1 : 0 }' "$source"
              configured=true
              processed=$((processed+1))
            fi
          done
          if [ "$configured" != true ]; then
            echo 'Expected Ubuntu APT sources were not found.' >&2
            exit 1
          fi
          sudo tee /etc/apt/apt.conf.d/99-kps-ci-network > /dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          printf 'Ubuntu APT source files verified: %s\n' "$processed"
      - name: Install real Chromium and required system libraries
        run: python -m playwright install --with-deps chromium
      - name: Verify staff invitation and complete V5 journey early
        run: >-
          python -m pytest -q --strict-markers
          tests/test_staff_invitation_browser.py tests/test_v5_browser.py
          --junitxml=test-results/focused-staff-journeys.xml
      - name: Retain focused synthetic journey evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-staff-journeys-evidence
          path: |
            test-results/focused-staff-journeys.xml
            test-artifacts/*.png
            test-artifacts/*.json
            test-artifacts/*.pdf
            test-artifacts/*.csv
            test-artifacts/v5-reports/**
          if-no-files-found: warn
          retention-days: 7

