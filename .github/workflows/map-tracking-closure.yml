name: Map tracking closure acceptance
on:
  push:
    branches: [agent/maps-tracking-closure-20261026]
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/route_eta.py
      - app/tracking_ingest.py
      - app/tracking_alerts.py
      - app/dispatch_map.py
      - app/central_operations.py
      - app/map_services.py
      - app/morning_manager_context.py
      - migrations/120_driver_tracking_history.sql
      - migrations/121_route_eta.sql
      - public/ops.js
      - public/assets/dispatch-map.js
      - public/assets/driver-location.js
      - tests/test_route_eta*.py
      - tests/test_tracking*.py
      - tests/test_tracking*.cjs
      - tests/test_mixed_route*.py
      - .github/workflows/map-tracking-closure.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-tracking-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Additional acceptance only: existing security/image, prior-application rollback,
# production preservation and full regression gates remain mandatory without waivers.
jobs:
  scoped-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_enbishan_map_tracking
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test_enbishan_map_tracking"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_enbishan_map_tracking
      TEST_BROWSER: '1'
      APP_ENV: testing
      OTP_PROVIDER: disabled
      EMAIL_PROVIDER: disabled
      EMAIL_WORKER_ENABLED: 'false'
      REPORT_WORKER_ENABLED: 'false'
      RUNTIME_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Staff and driver JavaScript integration
        run: |
          node --check public/ops.js
          node --check public/assets/dispatch-map.js
          node --check public/assets/driver-location.js
          node --test tests/test_tracking_manager.cjs tests/test_driver_trip_ui.cjs tests/test_central_operations_adapter.cjs
      - name: Road timing, scope, captured GPS, recovery and station evidence
        run: >-
          python -m pytest -q
          tests/test_route_eta_unit.py tests/test_route_eta_postgres.py
          tests/test_tracking_ingest.py tests/test_tracking_alerts.py tests/test_tracking_export_registry.py
          tests/test_mixed_route_context.py tests/test_mixed_route_return.py tests/test_mixed_routes_postgres.py tests/test_trip_history_postgres.py
          tests/test_driver_locations.py tests/test_driver_routes.py tests/test_map_services.py
          tests/test_central_operations.py tests/test_central_workdays.py
          tests/test_morning_manager_context.py tests/test_morning_manager_context_postgres.py
          --junitxml=test-results/map-tracking-integration.xml
      - name: Browser maps and driver regression
        run: >-
          python -m pytest -q
          tests/test_dispatch_map_browser.py tests/test_driver_gps_browser.py
          tests/test_delivery_tracking_browser.py tests/test_order_tracking_browser.py
          --junitxml=test-results/map-tracking-browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-tracking-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/
            test-artifacts/
          retention-days: 14
