name: London cake paid campaign acceptance
on:
  push:
    branches: [agent/london-cake-combo-20261114]
  pull_request:
    paths:
      - app/london_campaign.py
      - migrations/138_london_cake_combo.sql
      - public/assets/london-cake-*
      - tests/test_london_*
      - tests/london_banner_browser.cjs
      - .github/workflows/london-cake.yml
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_enbishan_london_campaign
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_enbishan_london_campaign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: node --check public/customer.js && node --test tests/test_london_banner.cjs
      - name: Canonical price, idempotence, advertising and gift regressions
        run: python -m pytest -q tests/test_london_campaign.py tests/test_storefront_advertising.py tests/test_storefront_advertising_postgres.py tests/test_first_order_gift.py tests/test_first_order_gift_postgres.py tests/test_multibrand_final_boundary.py tests/test_enbishan_dual_brand.py tests/test_enbishan_sms_boundary.py tests/test_enbishan_mandatory_customer_sms.py tests/test_runtime_revision.py --junitxml=test-results/london-campaign.xml
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Responsive campaign action and reduced motion
        run: |
          python -m http.server 8765 --directory public > /tmp/london-http.log 2>&1 &
          node tests/london_banner_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: london-campaign-acceptance
          path: test-results/

