name: Optional customer address acceptance
on:
  push:
    branches: [agent/optional-customer-address-20261021]
permissions:
  contents: read
jobs:
  address:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_optional_address
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_optional_address" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_optional_address
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: node --check public/customer.js && node --check public/assets/order-amendments.js
      - run: python -m pytest -q tests/test_optional_customer_address.py tests/test_customer_experience.py tests/test_customer_map.py tests/test_core.py tests/test_coverage_reasons.py --junitxml=test-results/optional-address.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-address-evidence
          path: test-results/optional-address.xml
