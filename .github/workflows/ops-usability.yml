name: Staff fleet and CRM focused acceptance
on:
  workflow_dispatch:
  push:
    branches: [agent/kps-order-security-closure-20261018]
    paths:
      - app/orders.py
      - app/fleet.py
      - app/fleet_management.py
      - public/ops.js
      - public/ops.css
      - tests/test_ops_usability*.py
      - tests/test_owner_staff_management.py
      - tests/test_additional_password_owner.py
      - tests/test_mandatory_sms_ui.cjs
      - .github/workflows/ops-usability.yml
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_ops_usability
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-synthetic-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_ops_usability" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-synthetic-only@127.0.0.1:5432/test_ops_usability
      TEST_BROWSER: '1'
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements-security-tests.lock
          python -m playwright install --with-deps chromium
      - run: |
          node --check public/ops.js
          node tests/test_mandatory_sms_ui.cjs
          python -m pytest -q tests/test_ops_usability.py tests/test_ops_usability_browser.py tests/test_simple_staff_sms_browser.py tests/test_operational_customer_lookup.py tests/test_fleet_self_service.py tests/test_additional_password_owner.py::test_owner_password_form_creates_only_after_confirmation tests/test_owner_staff_management.py::test_owner_employee_actions_in_browser tests/test_owner_staff_management.py::test_staff_branch_dropdown_count_cancel_and_save --junitxml=test-artifacts/ops-usability-ci.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-usability-${{ github.sha }}
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 7
