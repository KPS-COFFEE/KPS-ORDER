name: Printer manager focused acceptance
on:
  push:
    branches: [agent/kps-order-emergency-v4]
    paths: [.github/workflows/printer-manager-hotfix.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_owner_sms
          POSTGRES_USER: owner_sms_test
          POSTGRES_PASSWORD: isolated-owner-sms-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U owner_sms_test -d test_owner_sms" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://owner_sms_test:isolated-owner-sms-only@127.0.0.1:5432/test_owner_sms
      TEST_BROWSER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cee244541a8b041ea5b30a0c2ffd78bf69665306
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install isolated browser
        run: python -m playwright install --with-deps chromium
      - name: Verify source and scoped printer regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cee244541a8b041ea5b30a0c2ffd78bf69665306"
          node --check public/ops.js
          python -m pytest -q --tb=short --junitxml=test-results/printer-manager.xml tests/test_delivery_manager_operations_only.py tests/test_branch_printing.py tests/test_printer_city.py tests/test_hardening_printing.py tests/test_printer_setup_browser.py tests/test_employee_permissions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printer-manager-cee244541a8b041ea5b30a0c2ffd78bf69665306
          path: test-results/
          retention-days: 14
