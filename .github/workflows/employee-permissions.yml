name: Employee permission acceptance
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/employee_permissions.py
      - app/operations.py
      - app/driver_incentives.py
      - public/ops.js
      - tests/test_accountant_shift_permissions.py
      - tests/test_employee_permissions*.py
      - .github/workflows/employee-permissions.yml
  push:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/auth.py
      - app/employee_permissions.py
      - app/operations.py
      - app/orders.py
      - migrations/042_employee_permissions.sql
      - public/ops.js
      - public/ops.css
      - tests/test_employee_permissions*.py
      - .github/workflows/employee-permissions.yml
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_employee_permissions
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_employee_permissions" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_employee_permissions
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Bound Ubuntu dependency downloads on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          # Keep Ubuntu suites, components and signing keys unchanged. Only the
          # slow Azure mirror host is replaced with the official Ubuntu archive.
          configured=false
          processed=0
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's#://azure\.archive\.ubuntu\.com/#://archive.ubuntu.com/#g' "$source"
              # A local mirrorlist can select Azure even when the sources file
              # itself has no Azure URL. Verify every observed configuration path.
              sudo awk 'index($0,"azure.archive.ubuntu.com") { found=1 } END { exit found ? 1 : 0 }' "$source"
              configured=true
              processed=$((processed+1))
            fi
          done
          if [ "$configured" != true ]; then
            echo 'Expected Ubuntu APT sources were not found.' >&2
            exit 1
          fi
          sudo tee /etc/apt/apt.conf.d/99-kps-ci-network > /dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          printf 'Ubuntu APT source files verified: %s\n' "$processed"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_accountant_shift_permissions.py tests/test_employee_permissions.py tests/test_employee_permissions_browser.py tests/test_owner_extra_permissions.py tests/test_scoped_operational_permissions.py tests/test_owner_shift_views.py tests/test_owner_staff_management.py tests/test_driver_configuration_lock.py tests/test_vehicle_maintenance.py --junitxml=test-results/employee-permissions.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: employee-permission-evidence
          path: |
            test-results/employee-permissions.xml
            test-artifacts/employee-permissions-*.png
          retention-days: 7
