name: Employee permission acceptance
on:
  push:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/auth.py
      - app/employee_permissions.py
      - app/operations.py
      - app/orders.py
      - migrations/042_employee_permissions.sql
      - public/ops.js
      - public/ops.css
      - tests/test_employee_permissions*.py
      - .github/workflows/employee-permissions.yml
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_employee_permissions
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_employee_permissions" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_employee_permissions
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_employee_permissions.py tests/test_employee_permissions_browser.py tests/test_owner_staff_management.py tests/test_driver_configuration_lock.py tests/test_vehicle_maintenance.py --junitxml=test-results/employee-permissions.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: employee-permission-evidence
          path: |
            test-results/employee-permissions.xml
            test-artifacts/employee-permissions-*.png
          retention-days: 7
