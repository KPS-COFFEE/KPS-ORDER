name: KPS proposed app CPU only diagnosis
on:
  push:
    branches: [agent/financial-app-cpu-only-diagnostic-20261026]
permissions:
  contents: read
jobs:
  cpu_only:
    name: proposed app 2 CPU with current DB (${{ matrix.repetition }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_hosting_cpu_only
          POSTGRES_USER: hosting_test
          POSTGRES_PASSWORD: isolated-hosting-only
        ports: ['5432:5432']
        options: >-
          --cpus 0.5 --memory 1g --memory-swap 1g
          --health-cmd "pg_isready -U hosting_test -d test_hosting_cpu_only"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://hosting_test:isolated-hosting-only@127.0.0.1:5432/test_hosting_cpu_only
      KPS_LOAD_RESOURCE_PROFILE: cpu_only
      PYTHONDONTWRITEBYTECODE: '1'
      RUNTIME_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install unchanged pinned requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate fail-closed budget and unchanged workload guards
        run: python -m pytest tests/test_resource_load_profile.py tests/test_hardening_load_observer.py tests/test_hosting_report_check.py -q
      - name: Prepare actual two-core four-GiB application cgroup
        run: |
          mkdir -p test-artifacts
          KPS_LOAD_CGROUP_PATH="/sys/fs/cgroup/kps_order_load_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          printf 'KPS_LOAD_CGROUP_PATH=%s\n' "$KPS_LOAD_CGROUP_PATH" >> "$GITHUB_ENV"
          sudo --preserve-env=GITHUB_ACTIONS,KPS_LOAD_RESOURCE_PROFILE "$(command -v python)" tools/hardening_load.py \
            --prepare-application-cgroup "$KPS_LOAD_CGROUP_PATH" "$(id -u)" "$(id -g)" \
            2>&1 | tee test-artifacts/resource-setup.log
      - name: Retained 50 100 250 500 load, zero errors, recovery and reports
        run: >-
          python tools/hardening_load.py
          --max-error-rate 0
          --application-cgroup "$KPS_LOAD_CGROUP_PATH"
          --database-container '${{ job.services.postgres.id }}'
          --output test-artifacts/cpu_only-${{ matrix.repetition }}.json
      - name: Remove only this run's empty application group
        if: always() && env.KPS_LOAD_CGROUP_PATH != ''
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,KPS_LOAD_RESOURCE_PROFILE "$(command -v python)" tools/hardening_load.py
          --cleanup-application-cgroup "$KPS_LOAD_CGROUP_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proposed-app-cpu-only-${{ matrix.repetition }}-not-current-plan
          path: test-artifacts/
          if-no-files-found: error

