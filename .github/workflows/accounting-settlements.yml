name: Accounting settlements and card layout
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - tests/test_accounting_workspace_browser.py
      - tests/test_accounting_workspace_ui.cjs
      - app/employee_tickets.py
      - app/main.py
      - public/assets/employee-tickets.*
      - public/ops.js
      - public/ops.html
      - tests/test_employee_tickets.py
      - tests/test_employee_tickets_browser.py
      - tests/test_customer_finance_clarity.py
      - tests/test_customer_finance_clarity_browser.py
      - app/order_support.py
      - app/catalog.py
      - app/chat.py
      - app/accounting.py
      - app/financial_totals.py
      - app/shift_reconciliation.py
      - tests/test_shift_reconciliation.py
      - app/item_sales.py
      - app/complimentary.py
      - tests/test_zero_value_accounting.py
      - tests/test_item_sales_values.py
      - app/accounting_statements.py
      - app/accounting_export.py
      - app/operations.py
      - app/owner_test_void.py
      - migrations/095_owner_test_void.sql
      - tests/test_owner_test_void.py
      - tests/test_owner_test_void_browser.py
      - migrations/091_driver_accounting_settlements.sql
      - migrations/092_accounting_driver_statements.sql
      - public/assets/accounting.*
      - tests/test_driver_accounting_settlements.py
      - tests/test_accounting_deadlines.py
      - tests/test_accounting_driver_statements.py
      - tests/test_accounting_statements_browser.py
      - tests/test_accounting_cards_browser.py
      - .github/workflows/accounting-settlements.yml
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_enbishan_accounting_settlements
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_enbishan_accounting_settlements" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_enbishan_accounting_settlements
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/assets/accounting.js && node --check public/assets/employee-tickets.js && node --check public/ops.js && node tests/test_accounting_manager_card_state.cjs && node tests/test_driver_collection_ui.cjs && node tests/test_shift_reconciliation_ui.cjs && node tests/test_order_journey_ui.cjs && node tests/test_driver_support_ui.cjs && node tests/test_complimentary_approval_ui.cjs && node tests/test_complimentary_accounting_ui.cjs && node tests/test_accounting_treatment_ui.cjs && node tests/test_financial_completion_scope_ui.cjs
      - run: node --test tests/test_accounting_workspace_ui.cjs tests/test_accounting_alerts_ui.cjs
      - run: python -m pytest -q tests/test_accounting_workspace_browser.py tests/test_work_recovery_browser.py tests/test_work_replay_status.py tests/test_work_request_performance.py tests/test_driver_readiness_observation.py tests/test_session_request_metadata.py tests/test_customer_finance_clarity.py tests/test_customer_finance_clarity_browser.py tests/test_order_support.py tests/test_morning_first_day.py tests/test_morning_manager_context_postgres.py tests/test_shift_reconciliation.py tests/test_order_financial_cases.py tests/test_order_financial_case_morning.py tests/test_manager_handover_scope.py tests/test_driver_support_central.py tests/test_morning_delivery_postgres.py tests/test_external_enbishan.py tests/test_central_workdays.py tests/test_employee_tickets.py tests/test_employee_tickets_browser.py tests/test_zero_value_accounting.py tests/test_item_sales_values.py tests/test_owner_test_void.py tests/test_owner_test_void_browser.py tests/test_accounting_deadlines.py tests/test_accounting_driver_statements.py tests/test_accounting_manager_shift_day.py tests/test_driver_statement_exports.py tests/test_driver_statement_entry_browser.py tests/test_accounting_statements_browser.py tests/test_driver_accounting_settlements.py tests/test_accounting_cards_browser.py tests/test_accounting.py tests/test_accounting_browser.py tests/test_delivery_center_matching.py tests/test_simple_driver_close.py tests/test_complimentary_deliveries.py tests/test_complimentary_browser.py tests/test_operations_lifecycle_backup.py tests/test_backup.py tests/test_delivery_reporting_boundaries.py --junitxml=test-results/accounting-settlements.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounting-settlements-evidence
          path: |
            test-results/accounting-settlements.xml
            test-artifacts/owner-test-void-*.png
            test-artifacts/work-recovery-*.png
            test-artifacts/driver-statement-*.png
            test-artifacts/accounting-manager-shifts-*.png
            test-artifacts/accounting-cards-*.png
            test-artifacts/accounting-manager-cards-*.png
            test-artifacts/accounting-driver-statement-*.png
            test-artifacts/employee-tickets-*.png
