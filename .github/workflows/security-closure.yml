      run: "image=\"kps-order-security-review:$CANDIDATE_SHA-${{ matrix.role }}\"\ntarget=runtime\nif [ '${{ matrix.role\
        \ }}' = rollback ]; then target=rollback; fi\ndocker buildx build --target \"$target\" --platform linux/amd64\
        \ --load --provenance=false \\\n  --label \"org.opencontainers.image.revision=$CANDIDATE_SHA\" \\\n  --metadata-file\
        \ evidence/build-metadata.json --tag \"$image\" . > evidence/image-build.log 2>&1\nimage_id=$(docker image\
        \ inspect --format '{{.Id}}' \"$image\")\nprintf '%s\\n' \"$image_id\" > evidence/candidate-image-id.txt\n\
        printf 'SECURITY_IMAGE_ID=%s\\n' \"$image_id\" >> \"$GITHUB_ENV\"\ndocker image inspect \"$image_id\" >\
        \ evidence/candidate-image-inspect.json\ndocker buildx imagetools inspect 'gcr.io/distroless/base-nossl-debian13:nonroot@sha256:8c563c1fb5e120606f0d85733049775faed6192e2bd2223ef283a5393eec22b9'\
        \ > evidence/runtime-base-manifest.txt\ndocker buildx imagetools inspect 'python:3.12.15-slim-trixie@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1'\
        \ > evidence/python-builder-manifest.txt\ndocker image save --output \"$RUNNER_TEMP/candidate-image.tar\"\
        \ \"$image_id\"\nsha256sum \"$RUNNER_TEMP/candidate-image.tar\" > evidence/candidate-image-archive-sha256.txt\n"
    - name: Record exact runtime component applicability
      run: "docker run --rm --network none --read-only --entrypoint python \"$SECURITY_IMAGE_ID\" -c '\nimport importlib.util,\
        \ json, pathlib, ssl, sys\nroot = pathlib.Path(\"/\")\npackages = json.loads(pathlib.Path(\"/usr/local/share/kps/runtime-packages.json\"\
        ).read_text())\nprint(json.dumps(packages, indent=2)); print(sys.version); print(ssl.OPENSSL_VERSION)\n\
        assert sys.version_info[:2] == (3, 12)\nassert importlib.util.find_spec(\"pip\") is None\nbanned = {\"libacl1\"\
        , \"libmount1\", \"libblkid1\", \"util-linux\", \"mount\", \"gzip\", \"ncurses-bin\", \"libsqlite3-0\",\
        \ \"libuuid1\"}\nassert not banned.intersection(p[\"package\"] for p in packages[\"complete_packages\"])\n\
        for name in (\"/usr/bin/mount\", \"/usr/bin/gzip\", \"/usr/bin/infocmp\", \"/usr/lib/systemd/systemd-homed\"\
        ):\n    assert not pathlib.Path(name).exists(), name\nfor pattern in (\"libacl.so*\", \"libmount.so*\",\
        \ \"libblkid.so*\", \"libsqlite3.so*\", \"*minizip*\", \"Tar.pm\"):\n    found = list(pathlib.Path(\"/usr\"\
        ).rglob(pattern)); assert not found, found\nfor p in pathlib.Path(\"/usr\").rglob(\"*\"):\n    if p.is_file():\
        \ assert not p.stat().st_mode & 0o6000, str(p)\nassert pathlib.Path(\"/bin/sh\").exists() == packages[\"\
        rollback_shell\"]\nimport fastapi, psycopg, PIL, cryptography, uvloop, reportlab\n' > evidence/runtime-components.txt\
        \ 2>&1\n"
    - name: Focused suites inside the same immutable image
      run: "python -m pip install --require-hashes --only-binary=:all: --target \"$RUNNER_TEMP/security-test-tools\"\
        \ -r requirements-security-tests.lock\nchmod 0777 evidence\nmapfile -t suites < <(sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d'\
        \ docs/final-operational-tests.txt)\ndocker run --rm --network host --entrypoint python \\\n  --mount \"\
        type=bind,src=$PWD/ci-safety,dst=/security-safety,readonly\" \\\n  --mount \"type=bind,src=$RUNNER_TEMP/security-test-tools,dst=/security-test-tools,readonly\"\
        \ \\\n  --mount \"type=bind,src=$PWD/tests,dst=/app/tests,readonly\" \\\n  --mount \"type=bind,src=$PWD/docs,dst=/app/docs,readonly\"\
        \ \\\n  --mount \"type=bind,src=$PWD/Dockerfile,dst=/app/Dockerfile,readonly\" \\\n  --mount \"type=bind,src=$PWD/.dockerignore,dst=/app/.dockerignore,readonly\"\
        \ \\\n  --mount \"type=bind,src=$PWD/requirements.txt,dst=/app/requirements.txt,readonly\" \\\n  --mount\
        \ \"type=bind,src=$PWD/.github/workflows/software-hardening.yml,dst=/app/.github/workflows/software-hardening.yml,readonly\"\
        \ \\\n  --mount \"type=bind,src=$PWD/tools/container_entrypoint.py,dst=/app/tools/container_entrypoint.py,readonly\"\
        \ \\\n  --mount \"type=bind,src=$PWD/tools/rollback_application_overlay,dst=/app/tools/rollback_application_overlay,readonly\"\
        \ \\\n  --mount \"type=bind,src=$PWD/tools/profile_checkout.py,dst=/app/tools/profile_checkout.py,readonly\"\
        \ \\\n  --mount \"type=bind,src=$PWD/tools/hardening_load.py,dst=/app/tools/hardening_load.py,readonly\"\
        \ \\\n  --mount \"type=bind,src=$(readlink -f \"$(command -v node)\"),dst=/usr/local/bin/node,readonly\"\
        \ \\\n  --mount \"type=bind,src=$PWD/evidence,dst=/evidence\" \\\n  --env PYTHONPATH=/security-safety:/security-test-tools:/app\
        \ \\\n  --env TEST_DATABASE_URL=\"$TEST_DATABASE_URL\" --env APP_ENV=testing \\\n  --env OTP_PROVIDER=disabled\
        \ --env EMAIL_PROVIDER=disabled \\\n  --env REPORT_WORKER_ENABLED=false --env EMAIL_WORKER_ENABLED=false\
        \ \\\n  --env RECOVERY_POLL_ENABLED=false --env RUNTIME_REVISION=\"$CANDIDATE_SHA\" \\\n  \"$SECURITY_IMAGE_ID\"\
        \ -m pytest -q \"${suites[@]}\" -k \"not real_browser\" --deselect tests/test_additional_password_owner.py::test_owner_password_form_creates_only_after_confirmation --deselect tests/test_owner_staff_management.py::test_owner_employee_actions_in_browser --deselect tests/test_owner_staff_management.py::test_staff_branch_dropdown_count_cancel_and_save \\\n  -p no:cacheprovider --junitxml=/evidence/container-security-focused.xml\
        \ \\\n  | tee evidence/container-security-focused.log\npython - <<'CHECK'\nimport xml.etree.ElementTree\
        \ as E\ncases=list(E.parse('evidence/container-security-focused.xml').getroot().iter('testcase'))\nassert\
        \ cases, 'No immutable-image test cases were executed'\nfor case in cases:\n    assert not any(case.find(tag)\
        \ is not None for tag in ('failure', 'error', 'skipped')), case.attrib\nCHECK\n"
    - name: Three mandatory Chromium cases against the same immutable image
      run: |
        set -euo pipefail
        browser=$(command -v google-chrome || command -v google-chrome-stable)
        "$browser" --headless --no-sandbox --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=19222 --remote-allow-origins=http://127.0.0.1:19222 --user-data-dir="$RUNNER_TEMP/exact-image-chromium" about:blank > evidence/image-chromium.log 2>&1 &
        chrome_pid=$!
        export KPS_CHROME_PID="$chrome_pid"
        trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
        mkdir -p ci-image-browser evidence/image-browser-screenshots
        chmod 0777 evidence/image-browser-screenshots
        cat > ci-image-browser/exact_image_browser.py <<'PLUGIN'
        import pytest
        @pytest.hookimpl(tryfirst=True)
        def pytest_fixture_setup(fixturedef, request):
            if fixturedef.argname != 'chromium_browser':
                return None
            from playwright.sync_api import sync_playwright
            playwright = sync_playwright().start()
            try:
                browser = playwright.chromium.connect_over_cdp('http://127.0.0.1:19222')
            except BaseException:
                playwright.stop()
                raise
            request.addfinalizer(playwright.stop)
            fixturedef.cached_result = (browser, fixturedef.cache_key(request), None)
            return browser
        PLUGIN
        python - <<'WAIT'
        import json,os,time,urllib.request
        # Cold Chromium startup on a shared runner is not an application latency gate.
        # Require a live CDP endpoint within a bounded wall-clock startup budget.
        started = time.monotonic()
        deadline = started + 60
        while True:
            os.kill(int(os.environ['KPS_CHROME_PID']), 0)
            remaining = deadline - time.monotonic()
            if remaining <= 0:
                raise RuntimeError('Chromium CDP did not become ready within 60 seconds')
            try:
                with urllib.request.urlopen('http://127.0.0.1:19222/json/version', timeout=min(2, remaining)) as r:
                    assert json.load(r)['webSocketDebuggerUrl']
                print(json.dumps({'chromium_cdp_ready_seconds': round(time.monotonic() - started, 3)}))
                break
            except Exception as error:
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    raise RuntimeError('Chromium CDP did not become ready within 60 seconds') from error
                time.sleep(min(.25, remaining))
        WAIT
        # Only tests/tools are mounted; app, migrations and public assets come from exact image bytes.
        docker run --rm --network host --entrypoint python \
          --mount "type=bind,src=$PWD/ci-safety,dst=/security-safety,readonly" \
          --mount "type=bind,src=$PWD/ci-image-browser,dst=/security-browser,readonly" \
          --mount "type=bind,src=$RUNNER_TEMP/security-test-tools,dst=/security-test-tools,readonly" \
          --mount "type=bind,src=$PWD/tests,dst=/app/tests,readonly" \
          --mount "type=bind,src=$PWD/evidence,dst=/evidence" \
          --mount "type=bind,src=$PWD/evidence/image-browser-screenshots,dst=/app/test-artifacts" \
          --env PYTHONPATH=/security-safety:/security-browser:/security-test-tools:/app \
          --env TEST_DATABASE_URL="$TEST_DATABASE_URL" --env TEST_BROWSER=1 \
          --env APP_ENV=testing --env RUNTIME_REVISION="$CANDIDATE_SHA" \
          "$SECURITY_IMAGE_ID" -m pytest -q -p exact_image_browser -p no:cacheprovider \
          tests/test_additional_password_owner.py::test_owner_password_form_creates_only_after_confirmation \
          tests/test_owner_staff_management.py::test_owner_employee_actions_in_browser \
          tests/test_owner_staff_management.py::test_staff_branch_dropdown_count_cancel_and_save \
          --junitxml=/evidence/container-three-browser.xml | tee evidence/container-three-browser.log
        python - <<'CHECK'
        import xml.etree.ElementTree as E
        cases=list(E.parse('evidence/container-three-browser.xml').getroot().iter('testcase'))
        assert len(cases)==3, len(cases)
        assert not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped'))
        CHECK
    - name: Exact image runtime health and readiness
      env:
        PYTHONPATH: ci-safety:.
      run: "docker run --detach --name security-candidate --network host \\\n  --mount \"type=bind,src=$PWD/ci-safety,dst=/security-safety,readonly\"\
        \ \\\n  --env PYTHONPATH=/security-safety:/app \\\n  --env DATABASE_URL=\"$TEST_DATABASE_URL\" --env APP_ENV=testing\
        \ \\\n  --env OTP_PROVIDER=disabled --env EMAIL_PROVIDER=disabled \\\n  --env REPORT_WORKER_ENABLED=false\
        \ --env EMAIL_WORKER_ENABLED=false \\\n  --env RECOVERY_POLL_ENABLED=false --env DISPATCH_AUTO_ASSIGN_ENABLED=false\
        \ \\\n  --env DISPATCH_OFFER_ACCEPT_ENABLED=false \\\n  --env APP_ALLOWED_HOSTS=localhost,127.0.0.1 \\\n\
        \  --env PORT=18080 --env RUNTIME_REVISION=\"$CANDIDATE_SHA\" \"$SECURITY_IMAGE_ID\"\npython - <<'PY' | tee\
        \ evidence/container-smoke.json\nimport json, os, time, urllib.request\nfor attempt in range(90):\n    try:\n\
        \        result = {}\n        for endpoint in ('health', 'ready'):\n            with urllib.request.urlopen('http://127.0.0.1:18080/'\
        \ + endpoint, timeout=2) as r:\n                assert r.status == 200\n                result[endpoint]\
        \ = json.load(r)\n                assert result[endpoint]['revision'] == os.environ['CANDIDATE_SHA']\n    \
        \    print(json.dumps(result, indent=2)); break\n    except Exception:\n        if attempt == 89: raise\n\
        \        time.sleep(1)\nPY\ndocker inspect --format '{{.Image}}' security-candidate > evidence/running-container-image-id.txt\n\
        cmp evidence/candidate-image-id.txt evidence/running-container-image-id.txt\ndocker logs security-candidate\
        \ > evidence/container-runtime.log 2>&1\ndocker stop security-candidate\n"
    - name: Verify scanner tools and scan this exact image
