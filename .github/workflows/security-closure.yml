        echo 'c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  syft.tar.gz' | sha256sum -c -\n\
        curl --fail --location --retry 2 --max-time 120 -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz\n\
        echo 'e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  trivy.tar.gz' | sha256sum -c -\n\
        tar -xzf syft.tar.gz syft\ntar -xzf trivy.tar.gz trivy\n./syft version > \"$GITHUB_WORKSPACE/evidence/syft-version.txt\"\
        \n./trivy version > \"$GITHUB_WORKSPACE/evidence/trivy-version.txt\"\n./syft scan \"docker-archive:$RUNNER_TEMP/candidate-image.tar\"\
        \ -o \"cyclonedx-json=$GITHUB_WORKSPACE/evidence/candidate-image.cdx.json\"\n./trivy image --input \"$RUNNER_TEMP/candidate-image.tar\"\
        \ --scanners vuln,secret \\\n  --format json --output \"$GITHUB_WORKSPACE/evidence/candidate-image-scan.json\"\
        \ \\\n  --exit-code 0\n./trivy image --input \"$RUNNER_TEMP/candidate-image.tar\" --scanners vuln,secret\
        \ \\\n  --format json --output \"$GITHUB_WORKSPACE/evidence/candidate-image-high-critical.json\" \\\n  --exit-code\
