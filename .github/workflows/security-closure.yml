        \    open('evidence/postgresql-version.txt','w').write(version)\nCHECK\npython -m playwright install --with-deps\
        \ chromium\npython -m pip freeze > evidence/python-packages.txt\n"
    - name: Run exactly three SMS-correct browser tests
      run: "set -euo pipefail\npython -m pytest -v --tb=short   tests/test_additional_password_owner.py::test_owner_password_form_creates_only_after_confirmation\
        \   tests/test_owner_staff_management.py::test_owner_employee_actions_in_browser   tests/test_owner_staff_management.py::test_staff_branch_dropdown_count_cancel_and_save\
        \   --junitxml=evidence/final-three-browser.xml | tee evidence/final-three-browser.log\npython - <<'CHECK'\n\
        import xml.etree.ElementTree as E\nroot=E.parse('evidence/final-three-browser.xml').getroot()\ncases=list(root.iter('testcase'))\n\
        assert len(cases)==3, len(cases)\nfor case in cases:\n    assert not any(case.find(tag) is not None for\
        \ tag in ('error','failure','skipped')),case.attrib\nCHECK\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: final-three-browser-6b0739678fefb62c45baa792a7de6d9e107cb0a5
        path: evidence/
        retention-days: 7
        if-no-files-found: error
