        \ ':(exclude)tests/test_browser.py' ':(exclude)tests/browser_sms_helpers.py' ':(exclude)tests/test_additional_password_owner.py'\
        \ ':(exclude)tests/test_owner_staff_management.py'\nprintf \"%s\\n\" 6b0739678fefb62c45baa792a7de6d9e107cb0a5\
