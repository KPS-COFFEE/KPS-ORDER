name: Manager order return acceptance
on:
  pull_request:
    paths:
      - public/ops.js
      - public/assets/customer-order.js
      - tests/test_manager_order_return*
      - tests/test_morning_manager_browser.py
      - .github/workflows/manager-order-return.yml
permissions:
  contents: read
jobs:
  actual-manager-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: node --test tests/test_manager_order_return.cjs
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m pytest -q tests/test_manager_order_return_browser.py tests/test_staff_phone_edit_browser.py tests/test_morning_manager_browser.py --junitxml=test-results/manager-order-return.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-order-return-evidence
          path: test-results/
