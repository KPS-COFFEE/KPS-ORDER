name: Production preservation focused acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [agent/kps-order-security-closure-20261018, agent/kps-order-emergency-v4]
    paths:
      - app/**
      - migrations/**
      - public/**
      - tools/windows-print-bridge/**
      - tests/**
      - .github/workflows/production-preservation.yml
permissions:
  contents: read
concurrency:
  group: production-preservation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  crm-browser:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/connection-accounting-20261101' || github.head_ref == 'agent/screen-stability-urgent-20261030' || github.head_ref == 'agent/deadlock-read-stability-20261030' || github.head_ref == 'agent/enbishan-receipt-english-20261027' || github.head_ref == 'agent/financial-administrative-completion-20261026' || github.head_ref == 'agent/order-duplicate-partial-20261026' || github.head_ref == 'agent/maps-tracking-closure-20261026' || github.head_ref == 'agent/activate-bank-admin-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_crm_visual
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-synthetic-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_crm_visual" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-synthetic-only@127.0.0.1:5432/test_crm_visual
      TEST_BROWSER: '1'
      APP_ENV: testing
      OTP_PROVIDER: disabled
      EMAIL_PROVIDER: disabled
      REPORT_WORKER_ENABLED: 'false'
      EMAIL_WORKER_ENABLED: 'false'
      RECOVERY_POLL_ENABLED: 'false'
      RUNTIME_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Six focused real CRM browser cases
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements-security-tests.lock
          python -m playwright install --with-deps chromium
          python -m pytest -q tests/test_parallel_visual_acceptance.py -k authorized_customer_records_real_http_postgres --junitxml=evidence/crm.xml | tee evidence/crm.log
          python - <<'CHECK'
          import xml.etree.ElementTree as E
          cases=list(E.parse('evidence/crm.xml').getroot().iter('testcase'))
          assert len(cases)==6
          assert not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped'))
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-real-browser-${{ github.sha }}
          path: |
            evidence/
            test-artifacts/parallel-crm-real-*.png
          if-no-files-found: error
          retention-days: 14
  focused:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/connection-accounting-20261101' || github.head_ref == 'agent/screen-stability-urgent-20261030' || github.head_ref == 'agent/deadlock-read-stability-20261030' || github.head_ref == 'agent/enbishan-receipt-english-20261027' || github.head_ref == 'agent/financial-administrative-completion-20261026' || github.head_ref == 'agent/order-duplicate-partial-20261026' || github.head_ref == 'agent/maps-tracking-closure-20261026' || github.head_ref == 'agent/activate-bank-admin-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_production_preservation
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-synthetic-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_production_preservation" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-synthetic-only@127.0.0.1:5432/test_production_preservation
      TEST_BROWSER: '1'
      APP_ENV: testing
      OTP_PROVIDER: disabled
      EMAIL_PROVIDER: disabled
      REPORT_WORKER_ENABLED: 'false'
      EMAIL_WORKER_ENABLED: 'false'
      RECOVERY_POLL_ENABLED: 'false'
      RUNTIME_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements-security-tests.lock
          python -m playwright install --with-deps chromium
      - name: Focused policies, PostgreSQL, SMS, printers and operational preservation
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_driver_work_hours_backup.py tests/test_operational_customer_lookup.py tests/test_delivery_center_matching.py tests/test_employee_permissions_browser.py tests/test_parallel_visual_acceptance.py tests/test_owner_dispatch_readiness_contract.py tests/test_driver_work_hours_unit.py tests/test_driver_work_hours_postgres.py tests/test_driver_hours_reports.py tests/test_branch_order_employee_closure.py tests/test_scoped_operational_permissions.py tests/test_official_host_policy.py tests/test_employee_permissions.py tests/test_owner_extra_permissions.py tests/test_simple_staff_sms_browser.py tests/test_additional_password_owner.py tests/test_owner_sms_creation.py tests/test_owner_staff_management.py tests/test_branch_printing.py tests/test_print_bridge_domain_migration.py tests/test_hardening_printing.py tests/test_printer_city.py tests/test_printer_setup_browser.py tests/test_owner_phone_link.py tests/test_sms_mandatory_policy.py tests/test_split_payment.py tests/test_split_payment_browser.py tests/test_operations.py tests/test_hardening_operations.py tests/test_driver_cash_handover.py tests/test_simple_driver_close.py tests/test_driver_float.py tests/test_blind_driver_closure_unit.py --junitxml=evidence/focused.xml | tee evidence/focused.log
          node tests/test_driver_trip_ui.cjs
          node tests/test_driver_collection_ui.cjs
          node tests/test_driver_simple_ui.cjs
          node tests/test_mandatory_sms_ui.cjs
          node --check public/ops.js
          python -c "import xml.etree.ElementTree as E; cases=list(E.parse('evidence/focused.xml').getroot().iter('testcase')); assert cases and not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')), 'Focused verification must contain no failed, errored or skipped cases'"
      - name: Driver hours real browser responsive screenshots
        if: always()
        env:
          KPS_HOURS_SCREENSHOTS: evidence/driver-hours
        run: |
          set -euo pipefail
          python tests/browser_driver_hours_fixture.py | tee evidence/driver-hours-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preservation-${{ github.sha }}
          path: |
            evidence/
            test-artifacts/focused-staff-*.png
            test-artifacts/TEST_ONLY_printer_*.png
            test-artifacts/parallel-*.png
            test-artifacts/permissions-*.png
          retention-days: 14
  windows:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/connection-accounting-20261101' || github.head_ref == 'agent/screen-stability-urgent-20261030' || github.head_ref == 'agent/deadlock-read-stability-20261030' || github.head_ref == 'agent/enbishan-print-margin-20261028' || github.head_ref == 'agent/enbishan-receipt-english-20261027' || github.head_ref == 'agent/financial-administrative-completion-20261026' || github.head_ref == 'agent/order-duplicate-partial-20261026' || github.head_ref == 'agent/maps-tracking-closure-20261026' || github.head_ref == 'agent/activate-bank-admin-20261026'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile bridge and exercise renderer and endpoint self-test
        shell: pwsh
        run: |
          Set-Location tools/windows-print-bridge
          Copy-Item ../../public/assets/kps-receipt-logo.png logo.png
          Copy-Item ../../public/assets/enbishan-original.jpeg enbishan-logo.jpeg
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:KpsPrintBridge.exe /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /reference:System.Security.dll KpsPrintBridge.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./KpsPrintBridge.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path KpsPrintBridge.exe,KpsPrintBridge.cs,Start.cmd,README.txt,logo.png,enbishan-logo.jpeg -DestinationPath KPS-Print-Bridge-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-print-bridge-${{ github.sha }}
          path: tools/windows-print-bridge/KPS-Print-Bridge-Windows.zip
          retention-days: 14
