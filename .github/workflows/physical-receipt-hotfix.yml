name: Physical receipt hotfix
on:
  push:
    branches: [agent/physical-receipt-unblock-20261026]
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_enbishan_physical_receipt
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_enbishan_physical_receipt" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_enbishan_physical_receipt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: node --check public/ops.js && node tests/test_ops_error_messages.cjs && node tests/test_manager_preparation_ui.cjs
      - run: python -m pytest -q tests/test_enbishan_physical_receipt_boundary.py tests/test_driver_incentives_unit.py tests/test_aggregate_driver_closure.py tests/test_aggregate_manager_closure.py
