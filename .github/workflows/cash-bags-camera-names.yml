name: Driver bags camera and named actions
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/cash_bag_custody.py
      - tests/test_cash_bag_custody_scope_unit.py
      - tests/test_cash_bag_custody.py
      - app/cash_bags.py
      - app/aggregate_driver_closure.py
      - app/aggregate_manager_closure.py
      - app/administrative_guidance.py
      - app/employee_tickets.py
      - app/multibrand_migrations/008_driver_cash_bags.sql
      - app/multibrand_migrations/009_remote_driver_manager_approval.sql
      - app/operating_reports.py
      - tests/test_closure_ui_browser.py
      - tests/test_remote_driver_approval_unit.py
      - tests/test_driver_live_status.py
      - public/ops.js
      - public/assets/order-amendments.js
      - tests/test_driver_camera_browser.py
      - tests/test_aggregate_driver_closure.py
      - tests/test_administrative_guidance.py
      - .github/workflows/cash-bags-camera-names.yml
permissions:
  contents: read
jobs:
  focused-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_enbishan_cash_bags
          POSTGRES_USER: bag_test
          POSTGRES_PASSWORD: isolated-test-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bag_test -d test_enbishan_cash_bags" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://bag_test:isolated-test-password@127.0.0.1:5432/test_enbishan_cash_bags
      TEST_BROWSER: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/ops.js && node --check public/assets/order-amendments.js
      - run: python -m pytest -q tests/test_cash_bag_custody_scope_unit.py tests/test_cash_bag_custody.py tests/test_aggregate_driver_closure.py tests/test_aggregate_manager_closure.py tests/test_physical_receipt_boundary.py tests/test_administrative_guidance.py tests/test_employee_tickets.py tests/test_delivery_controls_backup.py tests/test_driver_camera_browser.py tests/test_central_workdays_browser.py tests/test_closure_ui_browser.py tests/test_closure_ui_context.py tests/test_remote_driver_approval_unit.py tests/test_driver_live_status.py --junitxml=batch-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cash-bags-camera-names-${{ github.event.pull_request.head.sha }}
          path: batch-results.xml
