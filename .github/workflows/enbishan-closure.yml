name: Enbishan external closure acceptance
on:
  push:
    branches: [agent/enbishan-manual-closure-20261019]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_print_alerts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_print_alerts" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_print_alerts
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/ops.js
      - run: python -m pytest -q tests/test_external_enbishan.py tests/test_external_enbishan_browser.py tests/test_simple_driver_close.py tests/test_driver_cash_handover.py tests/test_blind_driver_closure_unit.py --junitxml=test-results/enbishan-closures.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enbishan-closure-evidence
          path: test-results/enbishan-closures.xml
