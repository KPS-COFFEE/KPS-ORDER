name: Operational supervision and preparation routing
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/auth.py
      - app/employee_permissions.py
      - app/collected_order_authority.py
      - app/order_interventions.py
      - app/order_financial_cases.py
      - app/orders.py
      - app/operations.py
      - app/chat.py
      - app/fiscal_issuance.py
      - app/preparation_routing.py
      - app/branch_printing.py
      - app/driver_work_hours.py
      - app/driver_auto_return.py
      - app/dispatch_map.py
      - app/dispatch_impact.py
      - migrations/130_*.sql
      - public/ops.*
      - public/assets/order-interventions.*
      - public/assets/preparation-routing.*
      - public/assets/central-operations.js
      - tests/test_admin_operational_supervision.py
      - tests/test_admin_supervision_ui.cjs
      - tests/test_intervention_workflow*
      - tests/test_intervention_supervision_browser.py
      - tests/test_intervention_evidence_browser.py
      - tests/test_manager_intervention_evidence_upload.py
      - tests/test_preparation_routing*
      - tests/test_collected_rollback_guard.py
      - tests/test_owner_test_void.py
      - tests/test_hardening_order_pipeline.py
      - tools/rollback_application_overlay/**
      - tests/test_order_interventions.py
      - tests/test_employee_permissions.py
      - tests/test_order_financial_cases.py
      - .github/workflows/operational-supervision.yml
permissions:
  contents: read
concurrency:
  group: operational-supervision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-orders-and-accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_enbishan_supervision
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kps_test -d test_enbishan_supervision" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_enbishan_supervision
      APP_ENV: testing
      OTP_PROVIDER: disabled
      EMAIL_PROVIDER: disabled
      REPORT_WORKER_ENABLED: 'false'
      EMAIL_WORKER_ENABLED: 'false'
      RECOVERY_POLL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Browser-side workflow and branch routing contracts
        run: node --test tests/test_intervention_workflow_ui.cjs tests/test_admin_supervision_ui.cjs tests/test_preparation_routing_ui.cjs tests/test_intervention_reachability.cjs tests/test_central_operations_adapter.cjs tests/test_alert_permission_poll.cjs
      - name: Real database permission, workflow, routing and accounting preservation
        run: python tools/enbishan_test.py tests/test_admin_operational_supervision.py tests/test_employee_permissions.py tests/test_order_interventions.py tests/test_manager_intervention_evidence_upload.py tests/test_order_financial_cases.py tests/test_preparation_routing.py tests/test_central_operations.py tests/test_branch_printing.py tests/test_driver_work_hours_unit.py tests/test_driver_work_hours_postgres.py tests/test_order_amendments.py tests/test_collected_rollback_guard.py tests/test_owner_test_void.py tests/test_hardening_order_pipeline.py::test_atomic_checkout_response_matches_existing_projection_and_single_write
      - name: Require executed database evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('test-results/enbishan/results.xml').getroot().iter('testcase'))
          assert cases, 'No test cases were executed.'
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped')), 'Every selected acceptance case must execute and pass.'
          print('Verified passing cases:', len(cases))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-supervision-evidence
          path: test-results/enbishan/results.xml
          retention-days: 14
  arabic-supervision-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TEST_BROWSER: '1'
      APP_ENV: testing
      KPS_SUPERVISION_SCREENSHOTS: test-artifacts/supervision
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Bound Ubuntu dependency downloads on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          # Keep Ubuntu suites, components and signing keys unchanged. Only the
          # slow Azure mirror host is replaced with the official Ubuntu archive.
          configured=false
          processed=0
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's#://azure\.archive\.ubuntu\.com/#://archive.ubuntu.com/#g' "$source"
              # A local mirrorlist can select Azure even when the sources file
              # itself has no Azure URL. Verify every observed configuration path.
              sudo awk 'index($0,"azure.archive.ubuntu.com") { found=1 } END { exit found ? 1 : 0 }' "$source"
              configured=true
              processed=$((processed+1))
            fi
          done
          if [ "$configured" != true ]; then
            echo 'Expected Ubuntu APT sources were not found.' >&2
            exit 1
          fi
          sudo tee /etc/apt/apt.conf.d/99-kps-ci-network > /dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          printf 'Ubuntu APT source files verified: %s\n' "$processed"
      - run: python -m playwright install --with-deps chromium
      - name: Actual Arabic review, return and accounting dialogs
        run: python -m pytest -q tests/test_intervention_supervision_browser.py --junitxml=test-results/supervision-browser.xml
      - name: Require all six responsive scenarios to execute
        run: |
          python - <<'CHECK'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('test-results/supervision-browser.xml').getroot().iter('testcase'))
          assert len(cases) == 6
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
          CHECK
      - name: Actual evidence file selection and retained retry drafts
        run: python -m pytest -q tests/test_intervention_evidence_browser.py --junitxml=test-results/intervention-evidence-browser.xml
      - name: Require all three direct evidence scenarios to execute
        run: |
          python - <<'CHECK'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('test-results/intervention-evidence-browser.xml').getroot().iter('testcase'))
          assert len(cases) == 3
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-supervision-browser-evidence
          path: |
            test-results/supervision-browser.xml
            test-results/intervention-evidence-browser.xml
            test-artifacts/supervision/
          retention-days: 14
