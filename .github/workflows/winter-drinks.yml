name: Winter drinks owner acceptance
on:
  push:
    branches: [agent/winter-drinks-20261118]
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths: [app/winter_drinks.py, tests/test_winter_drinks*, .github/workflows/winter-drinks.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_winter_drinks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_winter_drinks
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_winter_drinks_rules.py tests/test_winter_drinks.py tests/test_london_campaign.py
