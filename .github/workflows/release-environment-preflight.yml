name: Exact-release environment preflight regressions
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/activation.py
      - app/runtime_revision.py
      - app/release_preflight.py
      - app/**.py
      - render.yaml
      - tests/test_release_environment_preflight.py
      - tests/test_runtime_revision.py
      - .github/workflows/release-environment-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked runtime and test tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements-security-tests.lock
      - name: Reproduce stale pins, missing approvals and safe preflight execution
        run: python -m pytest -q tests/test_release_environment_preflight.py tests/test_runtime_revision.py
