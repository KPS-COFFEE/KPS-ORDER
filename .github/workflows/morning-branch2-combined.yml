name: Combined Branch 2 morning release acceptance
on:
  push:
    branches: [agent/morning-branch2-combined-live-20261021, agent/morning-manager-ahmed-trial-20261021, agent/morning-night-trial-20261021, agent/morning-auto-dispatch-20261022, agent/morning-live-bells-20261022, agent/morning-manager-preparation-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_morning_combined
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_morning_combined" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_morning_combined
      TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/ops.js && node tests/test_alert_schedule_ui.cjs && node tests/test_driver_alerts_ui.cjs && node tests/test_morning_bell_ui.cjs && python -m compileall -q app
      - name: Combined PostgreSQL 18.6 authorization and workflow regression
        run: >-
          python -m pytest -q
          tests/test_morning_auto_dispatch_postgres.py tests/test_morning_manager_dispatch_security_postgres.py
          tests/test_morning_trial_postgres.py tests/test_morning_trial_security_postgres.py
          tests/test_dispatch_workspace_counts.py tests/test_tawked_otp.py tests/test_employee_sms_diagnostics.py
          tests/test_morning_preparer_queue_unit.py tests/test_morning_preparer_postgres.py
          tests/test_driver_receipt_trial.py tests/test_driver_receipt_trial_postgres.py
          tests/test_morning_manager_context.py tests/test_morning_manager_context_postgres.py
          tests/test_morning_manager_fallback_postgres.py
          tests/test_morning_delivery.py tests/test_morning_delivery_postgres.py tests/test_morning_customer_postgres.py
          tests/test_morning_preparation.py
          tests/test_alert_policy.py tests/test_operational_alerts.py tests/test_morning_policy_identity_postgres.py
          tests/test_branch_printing.py tests/test_employee_permissions.py tests/test_driver_configuration_lock.py
          tests/test_driver_closure_authorization.py tests/test_driver_order_scope.py
          tests/test_accountant_shift_permissions.py tests/test_driver_accounting_settlements.py
          tests/test_complimentary_deliveries.py tests/test_delivery_manager_operations_only.py
          tests/test_delivery_center_matching.py
          --junitxml=test-results/morning-combined-postgres.xml
      - name: Arabic English mobile desktop and unchanged driver browser acceptance
        if: always()
        run: >-
          python -m pytest -q
          tests/test_morning_dispatch_browser.py tests/test_morning_trial_browser.py tests/test_morning_bell_browser.py
          tests/test_morning_preparer_browser.py tests/test_morning_manager_browser.py
          tests/test_morning_policy_browser.py tests/test_morning_policy_identity_browser.py tests/test_delivery_workspace_browser.py tests/test_driver_simple_browser.py
          tests/test_accounting_cards_browser.py tests/test_accounting_browser.py
          --junitxml=test-results/morning-combined-browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morning-combined-evidence
          path: |
            test-results/
            test-artifacts/
          retention-days: 7
