name: KPS ORDER Polling Deadlock Acceptance
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [agent/kps-order-emergency-v4]
permissions:
  contents: read
concurrency:
  group: kps-polling-deadlock-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  postgres-polling-concurrency:
    strategy:
      fail-fast: false
      matrix:
        application: [published-baseline, fixed-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_enbishan_polling_deadlock
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kps_test -d test_enbishan_polling_deadlock"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_enbishan_polling_deadlock
      APP_ENV: testing
      RUNTIME_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Reproduce PostgreSQL 40P01 cycles on the published baseline
        if: matrix.application == 'published-baseline'
        env:
          EXPECT_POLLING_DEADLOCK_BASELINE: '1'
        run: |
          git worktree add --detach /tmp/kps-polling-baseline 0672b881f255d31b45fd6a878bd7f5b540453b5d
          cp tests/test_polling_deadlock_postgres.py /tmp/kps-polling-baseline/tests/
          cd /tmp/kps-polling-baseline
          python -m pytest -q --strict-markers tests/test_polling_deadlock_postgres.py -k 'not next_read' --junitxml="$GITHUB_WORKSPACE/test-results/published-baseline.xml"
      - name: Verify nonblocking candidate and fresh authorization
        if: matrix.application == 'fixed-candidate'
        run: python -m pytest -q --strict-markers tests/test_polling_deadlock_postgres.py --junitxml=test-results/fixed-candidate.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polling-deadlock-${{ matrix.application }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
