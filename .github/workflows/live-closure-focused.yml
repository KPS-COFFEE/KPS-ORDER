    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install pinned runtime and test requirements
      run: python -m pip install -r requirements.txt -r requirements-dev.txt
    - name: Install real Chromium and native browser dependencies
      run: python -m playwright install --with-deps chromium
    - name: Run exact candidate browser
      shell: bash
      run: 'set -o pipefail

        python -m pytest -q --tb=short --junitxml=test-artifacts/browser.xml tests/test_employee_sms_browser.py
        tests/test_driver_closure_browser.py tests/test_browser.py::test_real_all_staff_roles_driver_manager_closures_and_saved_report_files
        2>&1 | tee test-artifacts/browser.stdout.log'
    - name: Require executed browser cases without skips
      run: 'python - <<''PYTEST''

        import xml.etree.ElementTree as ET

        root=ET.parse(''test-artifacts/browser.xml'').getroot()

        cases=root.findall(''.//testcase'')

        assert cases, ''No browser cases executed''

        assert not root.findall(''.//skipped''), ''Browser skips cannot certify acceptance''

        PYTEST'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: live-closure-browser-0154ea9c7a439fcb076fa3c0c947cc954c85140d
        path: test-artifacts/
        if-no-files-found: error
        retention-days: 14
