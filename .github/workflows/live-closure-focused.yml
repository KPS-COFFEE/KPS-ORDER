name: KPS ORDER Exact Candidate Live Closure
'on':
  push:
    branches:
    - agent/kps-order-emergency-v4
    paths:
    - .github/workflows/live-closure-focused.yml
permissions:
  contents: read
concurrency:
  group: kps-live-closure-0154ea9c7a439fcb076fa3c0c947cc954c85140d-${{ github.sha }}
  cancel-in-progress: false
jobs:
  auth-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_live_closure
          POSTGRES_USER: closure_test
          POSTGRES_PASSWORD: isolated-closure-only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U closure_test -d test_live_closure" --health-interval 5s --health-timeout
          5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://closure_test:isolated-closure-only@127.0.0.1:5432/test_live_closure
      TEST_BROWSER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_PROXY: 127.0.0.1,localhost,::1
      RUNTIME_REVISION: 0154ea9c7a439fcb076fa3c0c947cc954c85140d
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 0154ea9c7a439fcb076fa3c0c947cc954c85140d
        persist-credentials: false
    - name: Record and verify immutable candidate identity
      shell: bash
      run: 'mkdir -p test-artifacts

        printf ''%s\n'' ''0154ea9c7a439fcb076fa3c0c947cc954c85140d'' > test-artifacts/expected-sha.txt

        git rev-parse HEAD > test-artifacts/actual-sha.txt

        git rev-parse ''HEAD^{tree}'' > test-artifacts/actual-tree.txt

        test "$(git rev-parse HEAD)" = ''0154ea9c7a439fcb076fa3c0c947cc954c85140d''

        test "$(git rev-parse ''HEAD^{tree}'')" = ''9cfac58ac9cf8ed91f71eeb5ec1cb730e9d2af99''

        printf ''%s\n'' ''Candidate 0154ea9c7a439fcb076fa3c0c947cc954c85140d; this workflow is focused functional
        evidence, not capacity certification.'' >> "$GITHUB_STEP_SUMMARY"'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install pinned runtime and test requirements
      run: python -m pip install -r requirements.txt -r requirements-dev.txt
    - name: Run exact candidate auth-concurrency
      shell: bash
      run: 'set -o pipefail

        python -m pytest -q --tb=short --junitxml=test-artifacts/auth-concurrency.xml tests/test_sms_rollout.py
        tests/test_employee_sms_portals.py tests/test_employee_sms_diagnostics.py tests/test_sms_email_retirement.py
        tests/test_sms_retirement_brand_scope.py tests/test_owner_sensitive_sms.py tests/test_context_cookie_isolation.py
        tests/test_hardening_pool.py tests/test_hardening_orders.py tests/test_hardening_order_pipeline.py tests/test_hardening_operations.py
        2>&1 | tee test-artifacts/auth-concurrency.stdout.log'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: live-closure-auth-concurrency-0154ea9c7a439fcb076fa3c0c947cc954c85140d
        path: test-artifacts/
        if-no-files-found: error
        retention-days: 14
