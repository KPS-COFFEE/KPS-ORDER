name: Enbishan real driver pickup regression
on:
  push:
    branches: [agent/enbishan-driver-pickup-20261025]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_enbishan_pickup_hotfix
          POSTGRES_USER: kps_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kps_test -d test_enbishan_pickup_hotfix"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kps_test:isolated-ci-password@127.0.0.1:5432/test_enbishan_pickup_hotfix
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: node --check public/ops.js
      - run: python -m pytest -q tests/test_delivery_workflow_policy.py tests/test_enbishan_pickup.py tests/test_operations.py tests/test_order_support.py tests/test_order_amendments.py tests/test_enbishan_dual_brand.py tests/test_delivery_hours.py tests/test_driver_physical_admission.py tests/test_delivery_workflow_controls.py --junitxml=pickup-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enbishan-pickup-${{ github.sha }}
          path: pickup-results.xml
