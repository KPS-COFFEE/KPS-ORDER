name: Owner SMS mobile focused acceptance
on:
  push:
    branches: [agent/kps-order-emergency-v4]
    paths: [.github/workflows/owner-sms-hotfix.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_owner_sms
          POSTGRES_USER: owner_sms_test
          POSTGRES_PASSWORD: isolated-owner-sms-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U owner_sms_test -d test_owner_sms" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://owner_sms_test:isolated-owner-sms-only@127.0.0.1:5432/test_owner_sms
      TEST_BROWSER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a4d0957825b67c7e0cbe90f16ff9eeaa1ac49aa
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install isolated browser
        run: python -m playwright install --with-deps chromium
      - name: Verify source and focused owner and SMS regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0a4d0957825b67c7e0cbe90f16ff9eeaa1ac49aa"
          node --check public/ops.js
          python -m pytest -q --tb=short --junitxml=test-results/owner-sms.xml tests/test_additional_password_owner.py tests/test_owner_sensitive_sms.py tests/test_owner_phone_link.py tests/test_owner_staff_management.py tests/test_employee_sms_portals.py tests/test_employee_sms_diagnostics.py tests/test_sms_email_retirement.py tests/test_sms_retirement_brand_scope.py tests/test_employee_sms_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-sms-0a4d0957825b67c7e0cbe90f16ff9eeaa1ac49aa
          path: test-results/
          retention-days: 14
