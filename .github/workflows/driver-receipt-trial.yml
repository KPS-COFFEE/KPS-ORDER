name: Morning driver receipt trial
on:
  push:
    branches: [agent/morning-driver-receipt-trial-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_driver_receipt_trial
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d test_driver_receipt_trial" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/test_driver_receipt_trial
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: node --check public/ops.js
      - run: python -m pytest -q tests/test_driver_receipt_trial_queue_unit.py tests/test_driver_receipt_trial_postgres.py tests/test_morning_delivery.py tests/test_morning_delivery_postgres.py tests/test_morning_customer_postgres.py tests/test_branch_printing.py tests/test_employee_permissions.py --junitxml=test-results/driver-receipt-trial.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-receipt-trial-evidence
          path: test-results/driver-receipt-trial.xml
