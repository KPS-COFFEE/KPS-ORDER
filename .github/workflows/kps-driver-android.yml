name: KPS Driver Android pilot
on:
  push:
    branches: [agent/kps-driver-android-pilot-20261021]
    paths: ['android-driver/**', '.github/workflows/kps-driver-android.yml']
  pull_request:
    paths: ['android-driver/**', '.github/workflows/kps-driver-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify authority and fresh location rules
        working-directory: android-driver
        run: |
          mkdir -p build/policy
          javac -d build/policy app/src/main/java/sa/kps/driver/TrackingPolicy.java tests/TrackingPolicyTest.java
          java -cp build/policy TrackingPolicyTest
      - name: Compile Android pilot
        working-directory: android-driver
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kps-driver-android-pilot-debug
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
