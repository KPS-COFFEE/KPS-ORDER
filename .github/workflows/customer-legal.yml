name: Customer legal presentation acceptance
on:
  push:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/customer_legal.py
      - app/customer_policy_content.py
      - public/customer.js
      - public/customer.css
      - public/index.html
      - public/assets/social/**
      - tests/test_legal_presentation*.py
      - .github/workflows/customer-legal.yml
permissions:
  contents: read
jobs:
  legal-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_legal
          POSTGRES_USER: legal_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U legal_test -d test_legal"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://legal_test:isolated-ci-password@127.0.0.1:5432/test_legal
      TEST_BROWSER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RUNTIME_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium webkit
      - name: Verify legal presentation, preserved identity and support
        run: >-
          python -m pytest -q --strict-markers
          tests/test_legal_presentation.py tests/test_legal_presentation_browser.py
          tests/test_customer_experience.py tests/test_customer_experience_browser.py
          tests/test_customer_final_account.py tests/test_customer_final_account_browser.py
          tests/test_http_security.py tests/test_v5_identity.py
          tests/test_customer_language.py::test_customer_translation_codes_are_complete_and_keep_approved_source_immutable
          --junitxml=test-results/customer-legal.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-legal-evidence
          path: |
            test-results/customer-legal.xml
            test-artifacts/legal-*.png
          if-no-files-found: error
          retention-days: 14
