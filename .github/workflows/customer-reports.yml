name: Customer cohorts and retention reports
on:
  pull_request:
    branches: [agent/kps-order-emergency-v4]
    paths:
      - app/customer_reports.py
      - public/customer-report.html
      - public/assets/customer-report.*
      - tests/test_customer_reports*.py
      - .github/workflows/customer-reports.yml
permissions:
  contents: read
concurrency:
  group: customer-reports-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  customer-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: test_customer_reports
          POSTGRES_USER: reports_test
          POSTGRES_PASSWORD: isolated-reports-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U reports_test -d test_customer_reports" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://reports_test:isolated-reports-only@127.0.0.1:5432/test_customer_reports
      TEST_BROWSER: '1'
      APP_ENV: testing
      RUNTIME_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check public/assets/customer-report.js && node --check public/ops.js
      - run: node tests/test_customer_report_access.cjs
      - name: Certify cohorts, historical boundaries, isolation, refund arithmetic and browser behavior
        run: python -m pytest -q tests/test_customer_reports.py tests/test_customer_crm.py tests/test_customer_reports_browser.py --junitxml=test-results/customer-reports.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-reports-${{ github.event.pull_request.head.sha }}
          path: test-results/
