<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حركة السيارات | KPS</title>
<link rel="stylesheet" href="/assets/saudi-plate.css"><link rel="stylesheet" href="/assets/fleet-missions.css">
<script defer src="/assets/saudi-plate.js"></script><script defer src="/assets/fleet-missions.js"></script></head>
<body><header><div><button type="button" id="fleetLogout" hidden>خروج</button><a id="backToOps" href="/ops">العودة إلى التشغيل</a><h1>حركة السيارات</h1></div><strong dir="ltr">KPS</strong></header>
<main><p role="status" id="msg" aria-live="polite">جارٍ تحميل العهد والأوامر…</p><div id="content" hidden>
<nav aria-label="أقسام حركة السيارات"><button data-tab="reports" hidden>التقرير اليومي</button><button data-tab="orders">أوامر الحركة</button><button data-tab="cars">السيارات والمفاتيح</button><button data-tab="routes" hidden>خطوط التوريد</button></nav>
<section id="reports" hidden><h2>التقرير اليومي</h2><form id="filters"><label>الكشف<select name="group"><option value="missions">سيارات المؤسسة والمهمات</option><option value="delivery">توصيل الطلبات</option></select></label><label>اليوم التشغيلي<input type="date" name="day" required></label><label>الموظف<select name="employee"></select></label><label>السيارة<select name="vehicle"></select></label><label>الحالة<select name="status"></select></label><label>المهمة<select name="kind"></select></label></form><div class="bar"><div><button data-export="pdf">تحميل PDF</button> <button data-export="xlsx">تحميل Excel</button> <button data-export="share">مشاركة PDF</button></div><small id="asof"></small></div><div class="stats" id="totals"></div><div class="tablewrap" id="reportRows"></div></section>
<section id="orders" hidden><p id="supervisorBranches" hidden></p><div class="bar"><h2>أوامر الحركة</h2><button id="newOrder">طلب حركة</button></div><dialog id="editor"><form id="create"><div class="bar"><h2>أمر حركة جديد</h2><button type="button" data-close>إغلاق</button></div><label>الموظف<select name="employee_id" required></select></label><label>المهمة<select name="kind" required></select></label><label>السيارة<select name="vehicle_id" required></select></label><label id="frequencyField" hidden>تكرار المهمة<select name="frequency"><option value="once">مرة واحدة</option><option value="daily">يوميًا</option><option value="weekly">أسبوعيًا</option></select></label><label id="occurrencesField" hidden>عدد المرات شاملًا أول مهمة<input name="occurrences" type="number" min="2" max="365" value="2" disabled required></label><label>موعد الخروج<input name="time" type="datetime-local" required></label><label>مدة المهمة<select name="planned_minutes" required></select></label><label id="destinationLabel"><span>الوجهة</span><input name="destination" maxlength="350"></label><div class="wide" id="chosenStops"></div><p id="editorError" class="error" role="alert"></p><button>حفظ الأمر</button></form></dialog><div class="cards" id="orderCards"></div></section>
<section id="cars" hidden><h2>السيارات والمفاتيح</h2><div class="cards" id="carCards"></div></section>
<section id="routes" hidden><h2>خطوط التوريد</h2><form id="routeForm"><label>الخط<select name="kind"></select></label><div class="wide" id="routeStops"></div><button>حفظ فروع الخط</button></form></section></div></main>
<dialog id="act"><form id="actionForm"><div class="bar"><h2 id="actionTitle"></h2><button type="button" data-close>إغلاق</button></div><div id="actionFields"></div><p id="actionError" class="error" role="alert"></p><button>تأكيد</button></form></dialog></body></html>
