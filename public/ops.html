<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>KPS ORDER — التشغيل</title>
  <script src="/assets/appearance.js?v=1"></script>
  <link rel="stylesheet" href="/ops.css?v=financial-matching-20261014">
  <link rel="stylesheet" href="/assets/appearance.css?v=1">
  <link rel="stylesheet" href="/assets/accounting.css">
  <script src="/assets/accounting.js?v=manager-matching-20261014" defer></script>
  <script src="/assets/fleet.js?v=20261014-distance" defer></script>
  <link rel="stylesheet" href="/assets/order-timing.css?v=20261014-layout3">
  <script src="/assets/order-timing.js?v=20261014-layout3" defer></script>
  <link rel="stylesheet" href="/assets/order-amendments.css?v=1">
  <script src="/assets/order-amendments.js?v=1" defer></script>

</head>
<body>
  <a class="skip" href="#main">انتقل للمحتوى</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="KPS COFFEE"><img src="/assets/kps-logo-fb911a7b4bb4.png" alt="KPS COFFEE" width="48" height="48"><span>ORDER <small id="ops-label">التشغيل</small></span></a>
    <div class="header-actions"><span id="session-label"></span><button type="button" id="language" class="quiet" lang="en">English</button><button type="button" id="logout" class="quiet" hidden>خروج</button></div>
  </header>
  <div id="status" role="status" aria-live="polite" class="status-line">جاري التحقق من الجلسة…</div>
  <div class="app-shell" id="app-shell" hidden>
    <aside class="side"><nav id="navigation" aria-label="التشغيل"></nav><p id="scope-note" class="muted"></p></aside>
    <main id="main" tabindex="-1"><div id="page-heading" class="page-heading"></div><div id="content"></div></main>
  </div>
  <main class="login-shell" id="login-shell" hidden>
    <section class="panel login-panel">
      <span class="eyebrow" dir="ltr">KPS ORDER</span><h1 id="login-title">دخول الموظفين</h1><p id="login-note" class="muted">حساب الموظف يحدد نطاق الوصول. الدخول المخصص للعملاء من المتجر.</p>
      <form id="staff-code-request-form"><label><span id="staff-phone-label">رقم الجوال المسجل</span><input name="phone" type="tel" autocomplete="username" inputmode="tel" dir="ltr" required minlength="8" maxlength="30"></label><p id="staff-code-note" class="muted">يصل كود الدخول والتفعيل إلى البريد المسجل للحساب.</p><p class="form-error" id="staff-code-request-error" role="alert"></p><button type="submit" id="staff-code-request-submit">إرسال كود الدخول</button><p id="staff-code-request-state" class="muted" role="status"></p></form>
      <form id="staff-code-verify-form" hidden><label><span id="staff-code-label">كود الدخول من 6 أرقام</span><input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" dir="ltr" required minlength="6" maxlength="6" pattern="[0-9٠-٩۰-۹]{6}" aria-describedby="staff-code-security"></label><label><span id="staff-activation-name-label">الاسم الكامل — عند تفعيل الدعوة</span><input name="display_name" type="text" autocomplete="name" maxlength="100"></label><p id="staff-code-security" class="muted">الكود صالح لمرة واحدة لمدة 15 دقيقة. لا تشاركه مع الآخرين.</p><p class="form-error" id="staff-code-verify-error" role="alert"></p><button type="submit" id="staff-code-verify-submit">تحقق ودخول</button><button type="button" id="staff-code-change-phone" class="quiet">تغيير الرقم</button><p id="staff-code-expiry" class="muted" role="status"></p></form><details class="legacy-login" open><summary id="legacy-login-label">الدخول الحالي بكلمة المرور</summary><form id="login-form"><label><span id="login-email-label">اسم الدخول</span><input name="username" type="text" autocomplete="username" dir="ltr" required maxlength="150"></label><label><span id="login-password-label">كلمة المرور</span><input name="password" type="password" autocomplete="current-password" dir="ltr" required maxlength="200"></label><p class="form-error" id="login-error" role="alert"></p><button type="submit" id="login-submit">دخول آمن</button></form></details>
    </section>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button type="button" id="modal-close" class="quiet" aria-label="إغلاق">×</button></div><div id="modal-body"></div></dialog>
</body>
</html>
