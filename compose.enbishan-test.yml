name: enbishan-isolated-test
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: test_enbishan_sandbox
      POSTGRES_USER: enbishan_test
      POSTGRES_PASSWORD: synthetic-local-test-only
    ports:
      - '127.0.0.1:55640:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enbishan_test -d test_enbishan_sandbox']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [isolated]
networks:
  isolated:
    internal: true
